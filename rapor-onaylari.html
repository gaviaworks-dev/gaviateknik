<!DOCTYPE html>
<html lang="tr">
<head>
<title>Rapor Onayları — GAVIA Periyodik Kontrol Yönetimi</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="assets/css/gavia-ui.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/print.css">
</head>
<body data-sec="teknik" data-screen="rapor-onaylari">
<div class="gv-app">
  <aside class="gv-rail" id="gvRail" aria-label="Modül menüsü"></aside>
  <nav class="gv-menu" id="gvMenu" aria-label="Sayfa menüsü"></nav>
  <div class="gv-divider" id="gvDivider" role="separator" aria-label="Menüyü daralt/genişlet"><span class="gv-grip"></span></div>
  <div class="gv-overlay" id="gvOverlay"></div>
  <header class="gv-top" id="gvTop"></header>

  <main class="gv-main">
    <div class="gv-page-head">
      <div>
        <div class="ph-eyebrow">Teknik Süreçler</div>
        <h1>Rapor Onay Kuyruğu</h1>
        <p class="ph-sub">Teknik onay bekleyen ve revizyon istenen raporlar. SLA süresi aşılanlar önce gösterilir; onaydan sonra rapor düzenlenemez, yalnız revizyon açılabilir.</p>
      </div>
      <div class="ph-actions no-print"><button class="btn btn-ghost" type="button" data-yazdir><i class="fa-solid fa-print" aria-hidden="true"></i>Yazdır</button></div>
    </div>
    <div class="kpi-grid" id="roKpi"></div>
    <div id="roKpiKapsam" hidden></div>
    <section class="gv-card">
            <div class="gv-listhead no-print">
        <div class="lh-row">
          <div class="lh-search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <label class="gv-sr" for="gvSearch">Listede ara</label>
            <input type="search" id="gvSearch" placeholder="Rapor no, lokasyon, personel…" autocomplete="off">
          </div>
          <div class="lh-acts">
            
            <button class="btn btn-sm btn-ghost gv-fp-open" type="button" id="gvFilterBtn">
              <i class="fa-solid fa-filter" aria-hidden="true"></i>Gelişmiş Filtre<span class="fp-count" id="gvFpCount" hidden>0</span>
            </button>
            
            
          </div>
        </div>
        <div class="lh-chiprow"><div class="chips" id="gvChips"></div></div>
      </div>
      <div class="gv-achips-row no-print" id="gvAchips" hidden></div>
      <div id="roBulk"></div>
      <div class="gc-body flush" id="roListe"></div>
      <div class="gv-pager" id="roPager" hidden></div>
    </section>
  </main>
</div>
<script src="assets/js/kimlik.js"></script>
<script src="assets/js/para-zaman.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="assets/js/demo-api.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/durum-makinesi.js"></script>
<script src="assets/js/form-controller.js"></script>
<script src="assets/js/kpi.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/filters.js"></script>
<script src="assets/js/forms.js"></script>
<script src="assets/js/types.js"></script>
<script src="assets/js/data-provider.js"></script>
<script src="assets/js/api-provider.js"></script>
<script src="assets/js/list-controller.js"></script>
<script src="assets/js/tooltip.js"></script>
<script>
(function(){
  var A = window.demoApi;
  var kaynak = A.raporlar().filter(function(r){
    return ['teknik-incelemede','revizyon-istendi','taslak','taserondan-bekleniyor'].indexOf(r.durum) !== -1;
  }).sort(function(a,b){
    var pa = a.slaDurum === 'asildi' ? 0 : a.slaDurum === 'yaklasti' ? 1 : 2;
    var pb = b.slaDurum === 'asildi' ? 0 : b.slaDurum === 'yaklasti' ? 1 : 2;
    return pa - pb;
  });

  gvKpi('#roKpi', [
    /* Panel KPI'sı ile AYNI seçici (doküman §8). */
    { ikon:'fa-stamp', sayi: GV.n(GV.kpiSay('onayBekleyenRapor')), etiket:'Onay bekleyen', ton:'warn' },
    { ikon:'fa-rotate-left', sayi: GV.n(kaynak.filter(function(r){ return r.durum === 'revizyon-istendi'; }).length), etiket:'Revizyon istenen', ton:'danger' },
    { ikon:'fa-pen-ruler', sayi: GV.n(kaynak.filter(function(r){ return r.durum === 'taslak'; }).length), etiket:'Taslak' },
    { ikon:'fa-hourglass-end', sayi: GV.n(kaynak.filter(function(r){ return r.slaDurum === 'asildi'; }).length), etiket:'SLA süresi aşan', ton:'danger' }
  ]);
  /* Kapsam filtresi ekranda GÖRÜNÜR olur (doküman §8). */
  document.getElementById('roKpiKapsam').hidden = false;
  GV.kpiKapsamNotu('#roKpiKapsam', { dislanan: GV.kpi('onayBekleyenRapor').dislanan });

  var liste = document.getElementById('roListe');
  


  function ciz(sonuc, bos){
    var dilim = sonuc.data;
    liste.innerHTML = dilim.length ? dilim.map(function(r){
      var slaR = r.slaDurum === 'asildi' ? GV.rozetOzel('danger','fa-hourglass-end', Math.abs(r.sla.kalanGun) + ' gün gecikme')
        : r.slaDurum === 'yaklasti' ? GV.rozetOzel('warn','fa-clock', r.sla.kalanGun + ' gün kaldı')
        : GV.rozetOzel('ok','fa-clock','Süre içinde');
      return '<div class="akm-row" style="display:flex;align-items:flex-start;gap:14px;padding:17px 22px;border-bottom:1px solid var(--line)">'
        + '<span style="width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:15px;'
        + 'background:var(--' + (r.durum === 'revizyon-istendi' ? 'danger' : 'warning') + '-tint);'
        + 'color:var(--' + (r.durum === 'revizyon-istendi' ? 'danger' : 'warning') + ')">'
        + '<i class="fa-solid fa-' + (r.durum === 'revizyon-istendi' ? 'rotate-left' : 'file-lines') + '" aria-hidden="true"></i></span>'
        + '<div style="flex:1;min-width:0">'
        + '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px">'
        + '<span style="font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums">' + GV.esc(r.no) + ' · v' + r.versiyon + '</span>'
        + GV.rozet('rapor', r.durum) + slaR
        + (r.sonuc === 'uygun-degil' ? GV.rozetOzel('danger','fa-circle-xmark','Uygun değil')
           : r.sonuc === 'sartli-uygun' ? GV.rozetOzel('warn','fa-circle-half-stroke','Şartlı uygun')
           : GV.rozetOzel('ok','fa-circle-check','Uygun')) + '</div>'
        + '<h3 style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px">'
        + '<a href="rapor-detay.html?id=' + r.id + '">' + GV.esc(r.lokasyonAd) + '</a></h3>'
        + '<p style="font-size:12.5px;color:var(--muted);line-height:1.55">'
        + GV.esc(r.musteriAd + ' · ' + r.kategoriAd + ' · ' + GV.n(r.ekipmanSayisi) + ' ekipman · '
          + GV.n(r.uygunsuzlukSayisi) + ' uygunsuzluk') + '</p>'
        + (r.revizyonNotu ? '<div class="gv-note danger" style="margin-top:9px;padding:9px 12px;font-size:12px">'
            + '<i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>' + GV.esc(r.revizyonNotu) + '</span></div>' : '')
        + '<div style="display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--muted)">'
        + '<span><i class="fa-solid fa-user-gear" aria-hidden="true"></i> ' + GV.esc(r.personelAd) + '</span>'
        + '<span><i class="fa-solid fa-calendar-check" aria-hidden="true"></i> Kontrol ' + GV.d(r.kontrolTarihi) + '</span>'
        + '<span><i class="fa-solid fa-file-pen" aria-hidden="true"></i> Rapor ' + GV.d(r.raporTarihi) + '</span>'
        + (r.sla ? '<span><i class="fa-solid fa-flag-checkered" aria-hidden="true"></i> Hedef ' + GV.d(r.sla.hedef) + '</span>' : '')
        + '</div></div>'
        + '<div style="flex:none;display:flex;flex-direction:column;gap:7px;align-items:flex-end">'
        + (r.durum === 'teknik-incelemede'
          ? '<button class="btn btn-sm btn-acc" type="button" data-onay="' + r.id + '"><i class="fa-solid fa-check" aria-hidden="true"></i>Onayla</button>'
            + '<button class="btn btn-sm btn-ghost" type="button" data-rev="' + r.id + '">Revizyon İste</button>'
          : '')
        + '<a class="btn btn-sm btn-ghost" href="rapor-detay.html?id=' + r.id + '">İncele</a></div></div>';
    }).join('')
      : gvEmpty(bos);

    liste.querySelectorAll('[data-onay]').forEach(function(b){
      b.addEventListener('click', function(){
        var r = A.rapor(b.getAttribute('data-onay'));
        gvConfirm({ baslik:'Teknik onay verilsin mi?',
          metin:'<b>' + GV.esc(r.no) + '</b> onaylanacak. <b>Onaydan sonra rapor doğrudan düzenlenemez</b>; '
            + 'değişiklik için yeni revizyon açılması gerekir.',
          onayEtiket:'Onayla', onayIkon:'fa-check', notAlani:true, notYer:'Onay notu (isteğe bağlı)…'
        }).then(function(s){
          if (!s.onay) return;
          GV.gecisUygula('rapor', 'raporlar', r.id, 'onaylandi', {
            not: s.not, ekYama: { onaylayanId: (GV.rolBilgi || {}).personelId || 'PRS-004' }
          }).then(function(g){
            if (!g.ok) return;
            gvToast(r.no + ' onaylandı.', { ton:'ok' });
            setTimeout(function(){ location.reload(); }, 800);
          });
        });
      });
    });
    liste.querySelectorAll('[data-rev]').forEach(function(b){
      b.addEventListener('click', function(){
        var r = A.rapor(b.getAttribute('data-rev'));
        gvConfirm({ baslik:'Revizyon istensin mi?', ton:'danger',
          metin:'<b>' + GV.esc(r.no) + '</b> hazırlayan personele geri gönderilecek.',
          onayEtiket:'Revizyon İste', onayIkon:'fa-rotate-left',
          notAlani:true, notZorunlu:true, notYer:'Hangi bölümde ne düzeltilmeli?'
        }).then(function(s){
          if (!s.onay) return;
          GV.gecisUygula('rapor', 'raporlar', r.id, 'revizyon-istendi', {
            not: s.not, ekYama: { revizyonNotu: s.not }
          }).then(function(g){
            if (!g.ok) return;
            gvToast('Revizyon talebi gönderildi.', { ton:'warn' });
            setTimeout(function(){ location.reload(); }, 800);
          });
        });
      });
    });
    GV.rolBaglantilariniIsle(liste);
  }


  var lc = gvList({
    kaynak: 'rapor_onaylari',
    veri: function(){ return kaynak; },
    arama: ['no','lokasyonAd','musteriAd','personelAd','kategoriAd'],
    cipler: { alan:'durum', secenekler:[
      { k:'teknik-incelemede', ad:'Onay bekleyen', ikon:'fa-stamp' },
      { k:'revizyon-istendi', ad:'Revizyon istenen', ikon:'fa-rotate-left' },
      { k:'taslak', ad:'Taslak', ikon:'fa-pen-ruler' }] },
    alanlar: [
      { k:'musteriId', ad:'Müşteri', tur:'coklu', secenekler: A.liste('musteriler').map(function(m){ return { deger:m.id, ad:m.kisaAd }; }) },
      { k:'slaDurum', ad:'SLA durumu', tur:'secim', secenekler:[
        { deger:'asildi', ad:'Süre aşıldı' }, { deger:'yaklasti', ad:'Süre yaklaştı' }, { deger:'uygun', ad:'Süre içinde' }] },
      { k:'kontrolPersoneliId', ad:'Kontrol personeli', tur:'coklu', secenekler: A.liste('personeller').map(function(p){ return { deger:p.id, ad:p.ad }; }) }
    ],
    hedef: '#roListe',
    pager: { hedef: '#roPager', boyut: 10, boyutSecici: true },
    filtreBosDurum: { ikon:'fa-circle-check', baslik:'Onay bekleyen rapor yok',
          metin:'Teknik onay kuyruğu boş. Bütün raporlar sonuçlandırıldı.' },
    bosDurum: { ikon:'fa-circle-check', baslik:'Rapor Onay Kuyruğu listesi boş', metin:'Bu modülde henüz kayıt oluşturulmamış.' },
    ciz: ciz
  });
  
})();
</script>
</body>
</html>
