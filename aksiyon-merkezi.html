<!DOCTYPE html>
<html lang="tr">
<head>
<title>Aksiyon Merkezi — GAVIA Periyodik Kontrol Yönetimi</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="assets/css/gavia-ui.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/print.css">
<style>

.ak-liste{display:flex;flex-direction:column}
.akm-row{display:flex;align-items:flex-start;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);transition:background .15s}
.akm-row:last-child{border-bottom:none}
.akm-row:hover{background:var(--bg)}
.akm-ico{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:15px;margin-top:2px}
.akm-body{flex:1;min-width:0}
.akm-body .akm-ust{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.akm-body .akm-kod{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.akm-body h3{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.akm-body h3 a:hover{color:var(--gv-action);text-decoration:underline}
.akm-body p{font-size:12.5px;color:var(--muted);line-height:1.55}
.akm-meta{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--muted)}
.akm-meta span{display:inline-flex;align-items:center;gap:6px}
.akm-acts{flex:none;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
@media(max-width:640px){
  .akm-row{padding:16px}
  .akm-acts{flex-direction:row;width:100%;margin-left:54px;justify-content:flex-start;flex-wrap:wrap}
}
</style>
</head>
<body data-sec="panel" data-screen="aksiyon-merkezi">
<div class="gv-app">
  <aside class="gv-rail" id="gvRail" aria-label="Modül menüsü"></aside>
  <nav class="gv-menu" id="gvMenu" aria-label="Sayfa menüsü"></nav>
  <div class="gv-divider" id="gvDivider" role="separator" aria-label="Menüyü daralt/genişlet"><span class="gv-grip"></span></div>
  <div class="gv-overlay" id="gvOverlay"></div>
  <header class="gv-top" id="gvTop"></header>

  <main class="gv-main">
    <div class="gv-page-head">
      <div>
        <div class="ph-eyebrow">Ana Panel</div>
        <h1>Aksiyon Merkezi</h1>
        <p class="ph-sub">Sizden işlem bekleyen bütün kayıtlar önem sırasına göre tek listede. Kaynak modül, gecikme süresi ve sorumlusu ile birlikte.</p>
      </div>
      <div class="ph-actions no-print"><button class="btn btn-ghost" type="button" data-yazdir><i class="fa-solid fa-print" aria-hidden="true"></i>Yazdır</button></div>
    </div>
    <div class="kpi-grid" id="akmKpi"></div>

    <section class="gv-card">
            <div class="gv-listhead no-print">
        <div class="lh-row">
          <div class="lh-search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <label class="gv-sr" for="gvSearch">Listede ara</label>
            <input type="search" id="gvSearch" placeholder="Aksiyonlarda ara — kayıt kodu, lokasyon, açıklama…" autocomplete="off">
          </div>
          <div class="lh-acts">
            
            <button class="btn btn-sm btn-ghost gv-fp-open" type="button" id="gvFilterBtn">
              <i class="fa-solid fa-filter" aria-hidden="true"></i>Gelişmiş Filtre<span class="fp-count" id="gvFpCount" hidden>0</span>
            </button>
            
            
          </div>
        </div>
        <div class="lh-chiprow"><div class="chips" id="gvChips"></div></div>
      </div>
      <div class="gv-achips-row no-print" id="gvAchips" hidden></div>
      <div class="gc-body flush" id="akmListe"></div>
      <div class="gv-pager" id="akmPager" hidden></div>
    </section>
  </main>
</div>
<script src="assets/js/kimlik.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="assets/js/demo-api.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/durum-makinesi.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/filters.js"></script>
<script src="assets/js/forms.js"></script>
<script src="assets/js/types.js"></script>
<script src="assets/js/data-provider.js"></script>
<script src="assets/js/list-controller.js"></script>
<script src="assets/js/tooltip.js"></script>
<script>
(function(){
  var A = window.demoApi, BUGUN = A.bugun();
  var kaynak = [];

  function ekle(o){ kaynak.push(o); }

  /* --- tarih onayı --- */
  A.isEmirleri().filter(function(i){ return !i.musteriTarihOnayi && ['planlandi','tarih-onayi-bekleniyor'].indexOf(i.operasyonDurum) !== -1; }).forEach(function(i){
    ekle({ tur:'tarih-onayi', turAd:'Tarih Onayı', onem:'orta', ikon:'fa-calendar-check', kod:i.id,
      baslik:'Kontrol tarihi müşteri tarafından onaylanmadı',
      metin:'Planlanan tarih ' + GV.d(i.tarih) + '. Müşteri yetkilisinden yazılı onay alınmadan ekip sahaya çıkamaz.',
      lokasyon:i.lokasyonAd, musteri:i.musteriAd, sorumlu:'Planlama Sorumlusu', sure:GV.gun(BUGUN, i.tarih),
      link:'is-emri-detay.html?id=' + i.id, modul:'Operasyon' });
  });
  /* --- rapor SLA --- */
  A.raporlar().filter(function(r){ return r.durum !== 'arsiv' && !r.teslimTarihi && r.sla && r.slaDurum !== 'uygun'; }).forEach(function(r){
    ekle({ tur:'rapor-sla', turAd:'Rapor SLA', onem: r.slaDurum === 'asildi' ? 'kritik':'yuksek', ikon:'fa-hourglass-end', kod:r.no,
      baslik: r.slaDurum === 'asildi' ? 'Rapor teslim süresi aşıldı' : 'Rapor teslim süresi yaklaşıyor',
      metin:'Sözleşmedeki teslim süresi ' + r.slaGun + ' gün. Hedef tarih ' + GV.d(r.sla.hedef) + '.',
      lokasyon:r.lokasyonAd, musteri:r.musteriAd, sorumlu: r.onaylayanAd || 'Teknik Yönetici', sure:r.sla.kalanGun,
      link:'rapor-detay.html?id=' + r.id, modul:'Teknik Rapor' });
  });
  /* --- kalibrasyon --- */
  A.liste('olcumCihazlari').forEach(function(c){
    var g = A.gunFarki(BUGUN, c.kalibrasyonBitis);
    if (g == null || g > 45) return;
    ekle({ tur:'kalibrasyon', turAd:'Kalibrasyon', onem: g < 0 ? 'kritik' : g <= 30 ? 'yuksek':'orta', ikon:'fa-vials', kod:c.kod,
      baslik: g < 0 ? 'Ölçüm cihazının kalibrasyonu geçti, kullanım dışı' : 'Ölçüm cihazının kalibrasyon süresi doluyor',
      metin: c.ad + ' (' + c.marka + ' ' + c.model + ') · geçerlilik ' + GV.d(c.kalibrasyonBitis) + '. '
        + (g < 0 ? 'Cihaz iş emirlerine atanamaz.' : 'Kalibrasyon randevusu planlanmalıdır.'),
      lokasyon:'GAVIA Teknik', musteri:'—', sorumlu:'Teknik Yönetici', sure:g,
      link:'cihaz-detay.html?id=' + c.id, modul:'Ölçüm Cihazı' });
  });
  /* --- eksik envanter --- */
  A.lokasyonlar().filter(function(l){ return ['bilgi-bekleniyor','envanter-bekleniyor'].indexOf(l.operasyonDurum) !== -1 && l.projeId; }).forEach(function(l){
    ekle({ tur:'envanter', turAd:'Envanter', onem:'orta', ikon:'fa-clipboard-question', kod:l.kod,
      baslik: l.operasyonDurum === 'envanter-bekleniyor' ? 'Lokasyon envanteri müşteriden bekleniyor' : 'Lokasyon bilgisi eksik',
      metin: l.not || 'Ön envanter şablondan uygulandı; müşteri teyidi olmadan planlama kesinleşemez.',
      lokasyon:l.ad, musteri:l.musteriAd, sorumlu:'Operasyon Yöneticisi', sure:null,
      link:'lokasyon-detay.html?id=' + l.id, modul:'Lokasyon' });
  });
  /* --- mutabakat --- */
  A.lokasyonlar().filter(function(l){ return l.faturaDurum === 'mutabakat-bekleniyor'; }).forEach(function(l){
    var farkli = A.mutabakatSatirlari(l.id).filter(function(m){ return m.durum !== 'onayli'; }).length;
    ekle({ tur:'mutabakat', turAd:'Mutabakat', onem:'yuksek', ikon:'fa-scale-balanced', kod:l.kod,
      baslik:'Ekipman miktarı mutabakatı müşteri onayında',
      metin: farkli + ' hizmet kaleminde planlanan ile sahada bulunan miktar farklı. Mutabakat onaylanmadan faturaya geçilemez.',
      lokasyon:l.ad, musteri:l.musteriAd, sorumlu:'Operasyon Yöneticisi', sure:null,
      link:'envanter-mutabakati.html?lokasyon=' + l.id, modul:'Envanter' });
  });
  /* --- fatura grubu --- */
  var grupluLok = {}; A.liste('faturaGruplari').forEach(function(g){ g.lokasyonlar.forEach(function(l){ grupluLok[l] = true; }); });
  A.lokasyonlar().filter(function(l){ return A.lokasyonFaturalanabilirMi(l.id).uygun && !grupluLok[l.id]; }).forEach(function(l){
    ekle({ tur:'fatura-grubu', turAd:'Faturalama', onem:'orta', ikon:'fa-layer-group', kod:l.kod,
      baslik:'Lokasyon fatura grubuna eklenmeyi bekliyor',
      metin:'Rapor onaylı ve mutabakat tamam. Faturalanabilir tutar yaklaşık ' + GV.tl(A.lokasyonFaturaTutari(l.id, l.projeId)) + '.',
      lokasyon:l.ad, musteri:l.musteriAd, sorumlu:'Finans ve Muhasebe', sure:null,
      link:'fatura-gruplari.html', modul:'Fatura' });
  });
  /* --- tahsilat --- */
  A.liste('faturalar').filter(function(f){ return f.kalan > 0; }).forEach(function(f){
    var g = GV.gun(BUGUN, f.vade), m = A.kayit('musteriler', f.musteriId);
    ekle({ tur:'tahsilat', turAd:'Tahsilat', onem: g < 0 ? 'kritik' : g <= 15 ? 'yuksek':'dusuk', ikon:'fa-file-invoice-dollar', kod:f.no,
      baslik: g < 0 ? 'Müşteri tahsilatı gecikti' : 'Fatura vadesi yaklaşıyor',
      metin:'Kalan bakiye ' + GV.tl(f.kalan) + '. Vade tarihi ' + GV.d(f.vade) + '.',
      lokasyon:'—', musteri: m ? m.kisaAd : '—', sorumlu:'Finans ve Muhasebe', sure:g,
      link:'tahsilatlar.html?id=' + f.id, modul:'Tahsilat' });
  });
  /* --- taşeron ödeme --- */
  A.liste('taseronHakedisleri').filter(function(t){ return ['musteri-tahsilati-bekleniyor','odemeye-uygun'].indexOf(t.durum) !== -1; }).forEach(function(t){
    var ts = A.kayit('taseronlar', t.taseronId);
    ekle({ tur:'taseron-odeme', turAd:'Taşeron Ödemesi', onem: t.durum === 'odemeye-uygun' ? 'yuksek':'dusuk', ikon:'fa-people-carry-box', kod:t.no,
      baslik: t.durum === 'odemeye-uygun' ? 'Taşeron hakedişi ödeme onayı bekliyor' : 'Taşeron ödemesi müşteri tahsilatına bağlı',
      metin: GV.tl(t.tutar) + ' tutarındaki hakediş · ' + t.not,
      lokasyon:'—', musteri: ts ? ts.kisaAd : '—', sorumlu:'Finans ve Muhasebe', sure:null,
      link:'taseron-hakedisleri.html?id=' + t.id, modul:'Taşeron' });
  });
  /* --- personel belgesi --- */
  A.liste('personelBelgeleri').forEach(function(b){
    var g = A.gunFarki(BUGUN, b.bitis);
    if (g == null || g > 45) return;
    var p = A.kayit('personeller', b.personelId), y = A.kayit('yetkinlikler', b.yetkinlikId);
    ekle({ tur:'belge', turAd:'Personel Belgesi', onem: g < 0 ? 'kritik' : g <= 30 ? 'yuksek':'orta', ikon:'fa-certificate', kod:b.belgeNo,
      baslik: g < 0 ? 'Personel yetkinlik belgesinin süresi doldu' : 'Personel yetkinlik belgesinin süresi doluyor',
      metin: (y ? y.ad : b.yetkinlikId) + ' · geçerlilik ' + GV.d(b.bitis) + '. '
        + (g < 0 ? 'Personel bu kapsamda kontrole atanamaz.' : 'Yenileme süreci başlatılmalıdır.'),
      lokasyon:'—', musteri: p ? p.ad : '—', sorumlu:'Kalite Yöneticisi', sure:g,
      link:'personel-detay.html?id=' + b.personelId, modul:'Personel' });
  });
  /* --- uygunsuzluk termini --- */
  A.liste('uygunsuzluklar').filter(function(u){ return u.durum !== 'kapandi'; }).forEach(function(u){
    var g = GV.gun(BUGUN, u.termin), l = A.lokasyon(u.lokasyonId);
    if (g > 30) return;
    ekle({ tur:'uygunsuzluk', turAd:'Uygunsuzluk', onem: u.onem === 'kritik' ? 'kritik' : g < 0 ? 'yuksek':'orta', ikon:'fa-circle-exclamation', kod:u.id,
      baslik: g < 0 ? 'Uygunsuzluk termini aşıldı' : 'Uygunsuzluk termini yaklaşıyor',
      metin: u.baslik + ' — ' + u.oneri,
      lokasyon: l ? l.ad : '—', musteri: l ? l.musteriAd : '—', sorumlu:'Teknik Yönetici', sure:g,
      link:'uygunsuzluk-detay.html?id=' + u.id, modul:'Uygunsuzluk' });
  });

  var ONEM = { kritik:{ ad:'Kritik', ton:'danger', ikon:'fa-fire', sira:0 },
               yuksek:{ ad:'Yüksek', ton:'warn', ikon:'fa-triangle-exclamation', sira:1 },
               orta:{ ad:'Orta', ton:'info', ikon:'fa-circle-info', sira:2 },
               dusuk:{ ad:'Düşük', ton:'off', ikon:'fa-circle', sira:3 } };
  kaynak.sort(function(a,b){ return ONEM[a.onem].sira - ONEM[b.onem].sira; });

  /* KPI */
  gvKpi('#akmKpi', ['kritik','yuksek','orta','dusuk'].map(function(k){
    return { ikon: ONEM[k].ikon, sayi: GV.n(kaynak.filter(function(x){ return x.onem === k; }).length),
      etiket: ONEM[k].ad + ' önemli aksiyon', ton: ONEM[k].ton === 'off' ? '' : ONEM[k].ton };
  }));

  var liste = document.getElementById('akmListe');
  


  function ciz(sonuc, bos){
    var dilim = sonuc.data;
    liste.innerHTML = dilim.length ? dilim.map(function(a){
      var o = ONEM[a.onem];
      var renk = o.ton === 'danger' ? 'danger' : o.ton === 'warn' ? 'warning' : o.ton === 'info' ? 'info' : 'muted';
      return '<div class="akm-row">'
        + '<span class="akm-ico" style="background:var(--' + (renk==='muted'?'bg':renk+'-tint') + ');color:var(--' + renk + ')">'
        + '<i class="fa-solid ' + a.ikon + '" aria-hidden="true"></i></span>'
        + '<div class="akm-body"><div class="akm-ust"><span class="akm-kod">' + GV.esc(a.kod) + '</span>'
        + GV.rozetOzel(o.ton, o.ikon, o.ad) + '<span class="gtag">' + GV.esc(a.turAd) + '</span></div>'
        + '<h3><a href="' + a.link + '">' + GV.esc(a.baslik) + '</a></h3>'
        + '<p>' + GV.esc(a.metin) + '</p>'
        + '<div class="akm-meta">'
        + '<span><i class="fa-solid fa-location-dot" aria-hidden="true"></i>' + GV.esc(a.lokasyon) + '</span>'
        + '<span><i class="fa-solid fa-building" aria-hidden="true"></i>' + GV.esc(a.musteri) + '</span>'
        + '<span><i class="fa-solid fa-user-gear" aria-hidden="true"></i>' + GV.esc(a.sorumlu) + '</span>'
        + (a.sure != null ? '<span><i class="fa-solid fa-clock" aria-hidden="true"></i>'
            + (a.sure < 0 ? Math.abs(a.sure) + ' gün gecikme' : a.sure + ' gün kaldı') + '</span>' : '')
        + '</div></div>'
        + '<div class="akm-acts"><a class="btn btn-sm btn-acc" href="' + a.link + '">İncele</a>'
        + '<button class="btn btn-sm btn-ghost" type="button" data-ertele="' + GV.esc(a.kod) + '">Ertele</button></div></div>';
    }).join('') : gvEmpty(bos);

    liste.querySelectorAll('[data-ertele]').forEach(function(b){
      b.addEventListener('click', function(){
        gvConfirm({ baslik:'Aksiyon ertelensin mi?', metin: b.getAttribute('data-ertele') + ' kaydı 3 gün süreyle listenizden gizlenecek. Kayıt kapanmaz, hatırlatma yeniden üretilir.',
          ton:'warn', onayEtiket:'Ertele', onayIkon:'fa-clock', notAlani:true, notYer:'Erteleme gerekçesi (isteğe bağlı)…'
        }).then(function(s){
          if (!s.onay) return;
          A.kayitAt('erteleme', 'Aksiyon Merkezi', b.getAttribute('data-ertele'), null, '3 gün', s.not || 'Gerekçe belirtilmedi.');
          gvToast('Aksiyon 3 gün ertelendi.', { ton:'ok' });
        });
      });
    });
    if (GV.rolBaglantilariniIsle) GV.rolBaglantilariniIsle(liste);
  }


  var lc = gvList({
    kaynak: 'aksiyon_merkezi',
    veri: function(){ return kaynak; },
    arama: ['kod','baslik','metin','lokasyon','musteri','modul'],
    cipler: { alan:'onem', secenekler: ['kritik','yuksek','orta','dusuk'].map(function(k){
      return { k:k, ad: ONEM[k].ad, ikon: ONEM[k].ikon }; }) },
    alanlar: [
      { k:'turAd', ad:'Aksiyon türü', tur:'coklu', secenekler: Array.from(new Set(kaynak.map(function(x){return x.turAd;}))).map(function(t){ return { deger:t, ad:t }; }) },
      { k:'modul', ad:'Modül', tur:'secim', secenekler: Array.from(new Set(kaynak.map(function(x){return x.modul;}))).map(function(t){ return { deger:t, ad:t }; }) },
      { k:'musteri', ad:'Müşteri / taraf', tur:'secim', secenekler: Array.from(new Set(kaynak.map(function(x){return x.musteri;}))).filter(function(x){return x!=='—';}).map(function(t){ return { deger:t, ad:t }; }) },
      { k:'gecikti', ad:'Yalnız gecikenler', tur:'toggle', suz: function(k,v){ return v !== 'evet' || (k.sure != null && k.sure < 0); },
        secenekler:[{deger:'evet',ad:'Evet'},{deger:'hayir',ad:'Hayır'}] }
    ],
    hedef: '#akmListe',
    pager: { hedef: '#akmPager', boyut: 20, boyutSecici: true },
    filtreBosDurum: { ikon:'fa-circle-check', baslik:'Bekleyen aksiyon yok', metin:'Seçtiğiniz filtrelere uyan açık aksiyon bulunmuyor.' },
    bosDurum: { ikon:'fa-circle-check', baslik:'Aksiyon Merkezi listesi boş', metin:'Bu modülde henüz kayıt oluşturulmamış.' },
    ciz: ciz
  });
  
})();
</script>
</body>
</html>
