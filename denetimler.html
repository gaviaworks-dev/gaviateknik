<!DOCTYPE html>
<html lang="tr">
<head>
<title>Denetimler — GAVIA Periyodik Kontrol Yönetimi</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="assets/css/gavia-ui.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/print.css">
<style>
  .gv-kirilim { display: flex; flex-wrap: wrap; gap: 5px }
</style>
</head>
<body data-sec="kalite" data-screen="denetimler">
<div class="gv-app">
  <aside class="gv-rail" id="gvRail" aria-label="Modül menüsü"></aside>
  <nav class="gv-menu" id="gvMenu" aria-label="Sayfa menüsü"></nav>
  <div class="gv-divider" id="gvDivider" role="separator" aria-label="Menüyü daralt/genişlet"><span class="gv-grip"></span></div>
  <div class="gv-overlay" id="gvOverlay"></div>
  <header class="gv-top" id="gvTop"></header>

  <main class="gv-main">
    <div class="gv-page-head">
      <div>
        <div class="ph-eyebrow">Kalite Yönetimi</div>
        <h1>Denetimler</h1>
        <p class="ph-sub">İç denetim, dış denetim ve taşeron denetimleri; kapsam, denetçi, bulgu kırılımı ve denetimden doğan düzeltici faaliyetlerle birlikte izlenir.</p>
      </div>
      <div class="ph-actions no-print"><button class="btn btn-ghost" type="button" id="dnDisa"><i class="fa-solid fa-file-export" aria-hidden="true"></i>Dışa Aktar</button>
      <button class="btn btn-acc" type="button" id="dnYeni"><i class="fa-solid fa-calendar-plus" aria-hidden="true"></i>Yeni Denetim Planla</button></div>
    </div>
    <div class="kpi-grid" id="dnKpi"></div>

    <div class="gv-tabbar" role="tablist" aria-label="Denetim görünümleri">
      <button class="gv-tab" role="tab" id="tbL" aria-controls="pnL" aria-selected="true"><i class="fa-solid fa-list" aria-hidden="true"></i>Denetimler</button>
      <button class="gv-tab" role="tab" id="tbG" aria-controls="pnG" aria-selected="false"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i>Bulgu Analizi</button>
    </div>

    <div id="pnL" role="tabpanel" aria-labelledby="tbL">
      <section class="gv-card">
        <div class="gv-listhead no-print">
          <div class="lh-row">
            <div class="lh-search">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <label class="gv-sr" for="gvSearch">Listede ara</label>
              <input type="search" id="gvSearch" placeholder="Denetim no, kapsam, denetçi, birim…" autocomplete="off">
            </div>
            <div class="lh-acts">
              <button class="btn btn-sm btn-ghost gv-fp-open" type="button" id="gvFilterBtn">
                <i class="fa-solid fa-filter" aria-hidden="true"></i>Gelişmiş Filtre<span class="fp-count" id="gvFpCount" hidden>0</span>
              </button>
              <button class="btn btn-sm btn-ghost" type="button" id="gvColsBtn"><i class="fa-solid fa-table-columns" aria-hidden="true"></i>Kolonlar</button>
            </div>
          </div>
          <div class="lh-chiprow"><div class="chips" id="gvChips"></div></div>
        </div>
        <div class="gv-achips-row no-print" id="gvAchips" hidden></div>
        <div class="gc-body flush" id="dnTablo"></div>
        <div class="gv-pager" id="dnPager" hidden></div>
      </section>
    </div>

    <div id="pnG" role="tabpanel" aria-labelledby="tbG" hidden>
      <div class="gv-grid-2">
        <section class="gv-card">
          <div class="gc-head"><h2 class="gc-title"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i>Bulgu Sınıfı Dağılımı</h2></div>
          <div class="gc-body"><div class="chart-box" id="dnDonut"></div></div>
        </section>
        <section class="gv-card">
          <div class="gc-head"><h2 class="gc-title"><i class="fa-solid fa-layer-group" aria-hidden="true"></i>Denetlenen Birim Bazlı Bulgu</h2></div>
          <div class="gc-body" id="dnBirim"></div>
        </section>
      </div>
      <section class="gv-card" style="margin-top:18px">
        <div class="gc-head"><h2 class="gc-title"><i class="fa-solid fa-chart-column" aria-hidden="true"></i>Denetim Türüne Göre Bulgu Sayısı</h2></div>
        <div class="gc-body"><div class="chart-box" id="dnTurBar"></div></div>
      </section>
    </div>
  </main>
</div>
<script src="assets/js/kimlik.js"></script>
<script src="assets/js/para-zaman.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="assets/js/demo-api.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/durum-makinesi.js"></script>
<script src="assets/js/form-controller.js"></script>
<script src="assets/js/kpi.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/filters.js"></script>
<script src="assets/js/forms.js"></script>
<script src="assets/js/types.js"></script>
<script src="assets/js/data-provider.js"></script>
<script src="assets/js/list-controller.js"></script>
<script src="assets/js/tooltip.js"></script>
<script>
(function(){
  var A = window.demoApi, BUGUN = A.bugun();
  gvTabs('.gv-tabbar');

  /* tür sözlüğü — anahtar, ikon, sıra */
  var TURLER = [
    { k:'ic',      ad:'İç Denetim',       ikon:'fa-house-chimney' },
    { k:'dis',     ad:'Dış Denetim',      ikon:'fa-building-shield' },
    { k:'taseron', ad:'Taşeron Denetimi', ikon:'fa-people-carry-box' }
  ];
  function turBilgi(ad){
    for (var i = 0; i < TURLER.length; i++) if (TURLER[i].ad === ad) return TURLER[i];
    return { k:'diger', ad: ad || '—', ikon:'fa-clipboard-check' };
  }
  var DURUM = {
    planlandi: ['wait','fa-calendar-day','Planlandı'],
    acik:      ['warn','fa-circle-dot','Açık'],
    kapandi:   ['ok','fa-circle-check','Kapandı']
  };
  function durumRozet(d){ var x = DURUM[d] || DURUM.acik; return GV.rozetOzel(x[0], x[1], x[2]); }

  function birimBilgi(b){
    if (b && b.indexOf('TSR-') === 0) {
      var t = A.kayit('taseronlar', b);
      return { ad: t ? t.kisaAd : b, link:'taseron-detay.html?id=' + b, taseron:true, unvan: t ? t.unvan : null };
    }
    return { ad: b || '—', link:null, taseron:false, unvan:null };
  }

  /* Kimlik kimlik.js'den (crypto.randomUUID) gelir; liste uzunluğu kimlik kaynağı değildir. */
  function yeniKod(kol, onek){
    var id;
    do { id = GV.yeniKod(onek); } while (A.kayit(kol, id));
    return id;
  }

  function zenginlestir(d){
    var t = turBilgi(d.tur), b = birimBilgi(d.denetlenenBirim);
    var p = d.denetciId ? A.kayit('personeller', d.denetciId) : null;
    return Object.assign({}, d, {
      turK: t.k, turIkon: t.ikon,
      denetciAd: p ? p.ad : null, denetciGorev: p ? p.gorev : null,
      birimAd: b.ad, birimLink: b.link, birimUnvan: b.unvan,
      dofSayisi: A.liste('duzelticiFaaliyetler').filter(function(f){ return f.kaynakId === d.id; }).length
    });
  }

  var kaynak = A.liste('denetimler').map(zenginlestir).sort(function(a,b){
    return (b.tarih || '').localeCompare(a.tarih || '');
  });

  function kayitBul(id){
    for (var i = 0; i < kaynak.length; i++) if (kaynak[i].id === id) return kaynak[i];
    return zenginlestir(A.kayit('denetimler', id) || {});
  }

  function topla(dizi, alan){ return dizi.reduce(function(t, d){ return t + (Number(d[alan]) || 0); }, 0); }

  gvKpi('#dnKpi', [
    { ikon:'fa-clipboard-user', sayi: GV.n(kaynak.length), etiket:'Toplam denetim',
      delta:{ yon:'flat', metin: kaynak.filter(function(d){ return d.durum === 'planlandi'; }).length + ' planlandı' } },
    { ikon:'fa-circle-dot', sayi: GV.n(kaynak.filter(function(d){ return d.durum === 'acik'; }).length),
      etiket:'Açık denetim', ton:'warn' },
    { ikon:'fa-triangle-exclamation', sayi: GV.n(topla(kaynak, 'bulguSayisi')), etiket:'Toplam bulgu',
      delta:{ yon:'flat', metin: GV.n(topla(kaynak, 'gozlem')) + ' gözlem ayrıca' } },
    { ikon:'fa-fire', sayi: GV.n(topla(kaynak, 'majorSayisi')), etiket:'Major bulgu', ton:'danger' }
  ]);

  var kolonlar = [
    { k:'tur', ad:'Denetim', kilitli:true, ciz: function(d){
        return '<div class="gcell"><div class="gcell-mark ' + (d.durum === 'kapandi' ? 'ok' : d.durum === 'planlandi' ? 'info' : 'warn') + '">'
          + '<i class="fa-solid ' + d.turIkon + '" aria-hidden="true"></i></div>'
          + '<div class="gcell-info"><div class="gcell-name">'
          + '<button class="btn-link" type="button" data-detay="' + GV.esc(d.id) + '">' + GV.esc(d.tur) + '</button></div>'
          + '<div class="gcell-sub">' + GV.esc(d.id) + '</div></div></div>'; } },
    { k:'kapsam', ad:'Kapsam', ciz: function(d){
        return '<span style="font-size:12.5px;color:var(--ink-2)">' + GV.esc(d.kapsam) + '</span>'; } },
    { k:'tarih', ad:'Tarih', ciz: function(d){ return GV.d(d.tarih); } },
    { k:'denetciAd', ad:'Denetçi', ciz: function(d){
        return d.denetciAd
          ? GV.esc(d.denetciAd) + '<br><span class="muted" style="font-size:11.5px">' + GV.esc(d.denetciGorev) + '</span>'
          : '<span class="muted">Dış denetçi kuruluş</span>'; } },
    { k:'birimAd', ad:'Denetlenen Birim', ciz: function(d){
        return d.birimLink
          ? '<a href="' + d.birimLink + '">' + GV.esc(d.birimAd) + '</a>'
            + '<br><span class="muted" style="font-size:11.5px">Taşeron</span>'
          : '<span class="gtag"><i class="fa-solid fa-sitemap" aria-hidden="true"></i>' + GV.esc(d.birimAd) + '</span>'; } },
    { k:'bulguSayisi', ad:'Bulgu', sinif:'num', ciz: function(d){
        return '<b style="font-size:14px">' + GV.n(d.bulguSayisi) + '</b>'; } },
    { k:'__kirilim', ad:'Major / Minor / Gözlem', ciz: function(d){
        return '<div class="gv-kirilim">'
          + GV.rozetOzel(d.majorSayisi ? 'danger' : 'off', 'fa-fire', 'Major ' + GV.n(d.majorSayisi))
          + GV.rozetOzel(d.minorSayisi ? 'warn' : 'off', 'fa-circle-exclamation', 'Minor ' + GV.n(d.minorSayisi))
          + GV.rozetOzel(d.gozlem ? 'info' : 'off', 'fa-eye', 'Gözlem ' + GV.n(d.gozlem))
          + '</div>'; } },
    { k:'dofSayisi', ad:'DÖF', varsayilanGizli:true, gizli:true, ciz: function(d){
        return d.dofSayisi
          ? '<a href="duzeltici-faaliyetler.html?q=' + encodeURIComponent(d.id) + '">' + GV.n(d.dofSayisi) + ' DÖF</a>'
          : '<span class="muted">Yok</span>'; } },
    { k:'durum', ad:'Durum', ciz: function(d){ return durumRozet(d.durum); } },
    { k:'__islem', ad:'İşlem', ciz: function(d){
        return '<div class="row-acts">'
          + '<button class="ia-btn" type="button" data-detay="' + GV.esc(d.id) + '" aria-label="' + GV.esc(d.id) + ' denetim detayı">'
          + '<i class="fa-solid fa-eye" aria-hidden="true"></i></button>'
          + '<button class="ia-btn" type="button" data-bulgu="' + GV.esc(d.id) + '" aria-label="' + GV.esc(d.id) + ' denetimine bulgu ekle">'
          + '<i class="fa-solid fa-plus" aria-hidden="true"></i></button>'
          + '</div>'; } }
  ];

  

  gvCols({ tetik:'#gvColsBtn', anahtar:'denetimler', kolonlar:kolonlar, degisti: function(){ liste.yenile(); } });
  var liste = gvList({
    kaynak: 'denetimler',
    veri: function(){ return kaynak; },
    arama: ['id','tur','kapsam','denetciAd','birimAd','rapor'],
    cipler: { alan:'turK', secenekler: TURLER.map(function(t){ return { k:t.k, ad:t.ad, ikon:t.ikon }; }) },
    alanlar: [
      { k:'durum', ad:'Durum', tur:'coklu', secenekler:[
        { deger:'planlandi', ad:'Planlandı' }, { deger:'acik', ad:'Açık' }, { deger:'kapandi', ad:'Kapandı' }] },
      { k:'tarih', ad:'Denetim tarihi', tur:'tarih' },
      { k:'denetciId', ad:'Denetçi', tur:'secim', secenekler: A.liste('personeller')
        .filter(function(p){ return kaynak.some(function(d){ return d.denetciId === p.id; }); })
        .map(function(p){ return { deger:p.id, ad:p.ad }; }) }
    ],
    tablo: { hedef: '#dnTablo',
      kolonlar: kolonlar,
      satirId: function(d){ return d.id; } },
    pager: { hedef: '#dnPager', boyut: 20, boyutSecici: true },
    filtreBosDurum: { ikon:'fa-clipboard-check', baslik:'Denetim kaydı yok',
      metin:'Filtrelerinize uyan denetim bulunmuyor. Yeni bir denetim planlayabilirsiniz.' },
    bosDurum: { ikon:'fa-clipboard-check', baslik:'Denetimler listesi boş', metin:'Bu modülde henüz kayıt oluşturulmamış.' },
    degisti: function(){
      document.querySelectorAll('[data-detay]').forEach(function(b){
      b.addEventListener('click', function(){ detay(b.getAttribute('data-detay')); });
    });
    document.querySelectorAll('[data-bulgu]').forEach(function(b){
      b.addEventListener('click', function(){ bulguEkle(b.getAttribute('data-bulgu')); });
    });
    }
  });
  




  /* ---------------- detay modalı ---------------- */
  function detay(id){
    var d = kayitBul(id);
    var dofler = A.liste('duzelticiFaaliyetler').filter(function(f){ return f.kaynakId === d.id; });

    var bilgi = '<dl class="info-rows">'
      + '<div class="info-row"><dt>Denetim no</dt><dd><b>' + GV.esc(d.id) + '</b></dd></div>'
      + '<div class="info-row"><dt>Tür</dt><dd>' + GV.esc(d.tur) + '</dd></div>'
      + '<div class="info-row"><dt>Kapsam</dt><dd>' + GV.esc(d.kapsam) + '</dd></div>'
      + '<div class="info-row"><dt>Tarih</dt><dd>' + GV.dUzun(d.tarih) + '</dd></div>'
      + '<div class="info-row"><dt>Denetçi</dt><dd>' + (d.denetciAd ? GV.esc(d.denetciAd + ' — ' + d.denetciGorev) : 'Dış denetçi kuruluş') + '</dd></div>'
      + '<div class="info-row"><dt>Denetlenen birim</dt><dd>'
        + (d.birimLink ? '<a href="' + d.birimLink + '">' + GV.esc(d.birimUnvan || d.birimAd) + '</a>' : GV.esc(d.birimAd)) + '</dd></div>'
      + '<div class="info-row"><dt>Durum</dt><dd>' + durumRozet(d.durum) + '</dd></div>'
      + '<div class="info-row"><dt>Denetim raporu</dt><dd>' + (d.rapor ? GV.esc(d.rapor) : GV.bos) + '</dd></div>'
      + '</dl>';

    var kirilim = '<div class="gv-note ' + (d.majorSayisi ? 'danger' : d.bulguSayisi ? 'warn' : 'ok') + '" style="margin-top:14px">'
      + '<i class="fa-solid ' + (d.majorSayisi ? 'fa-fire' : d.bulguSayisi ? 'fa-circle-exclamation' : 'fa-circle-check') + '" aria-hidden="true"></i>'
      + '<span><b>' + GV.n(d.bulguSayisi) + ' bulgu</b> — '
      + GV.n(d.majorSayisi) + ' major, ' + GV.n(d.minorSayisi) + ' minor, ' + GV.n(d.gozlem) + ' gözlem. '
      + (d.majorSayisi ? 'Major bulgular için düzeltici faaliyet açılması zorunludur.'
         : d.bulguSayisi ? 'Minor bulgular termin içinde giderilmelidir.'
         : 'Bu denetimde bulgu kaydedilmedi.') + '</span></div>';

    var dofBolum = '<div class="gv-botsec"><h3 class="gv-botsec-h"><i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i>'
      + 'Bu Denetimden Doğan Düzeltici Faaliyetler <span class="bs-sub">' + GV.n(dofler.length) + ' kayıt</span></h3>'
      + (dofler.length
        ? '<div class="gv-tscroll gv-cap"><table class="gtable"><thead><tr>'
          + '<th scope="col">DÖF No</th><th scope="col">Başlık</th><th scope="col">Sorumlu</th>'
          + '<th scope="col">Termin</th><th scope="col">Durum</th></tr></thead><tbody>'
          + dofler.map(function(f){
              var p = f.sorumluId ? A.kayit('personeller', f.sorumluId) : null;
              return '<tr><td data-lbl="DÖF No"><a href="duzeltici-faaliyetler.html?q=' + encodeURIComponent(f.id) + '">' + GV.esc(f.id) + '</a></td>'
                + '<td data-lbl="Başlık">' + GV.esc(f.baslik) + '</td>'
                + '<td data-lbl="Sorumlu">' + GV.esc(p ? p.ad : GV.bos) + '</td>'
                + '<td data-lbl="Termin">' + GV.d(f.termin) + '</td>'
                + '<td data-lbl="Durum">' + (f.durum === 'kapandi'
                    ? GV.rozetOzel('ok','fa-circle-check','Kapandı')
                    : GV.rozetOzel('warn','fa-circle-dot','Açık')) + '</td></tr>';
            }).join('') + '</tbody></table></div>'
        : '<div class="gv-note"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>'
          + '<span>Bu denetimden doğan düzeltici faaliyet kaydı yok. Bulgular için DÖF açarak takip başlatabilirsiniz.</span></div>')
      + '</div>';

    gvModal({
      baslik: d.id + ' — ' + d.tur, ikon:'fa-clipboard-user', genislik:'gv-modal-lg',
      metin: GV.esc(d.kapsam),
      govde: bilgi + kirilim + dofBolum,
      butonlar: [
        { etiket:'Kapat', sinif:'btn-ghost' },
        { etiket:'Bulgu Ekle', sinif:'btn-ghost', ikon:'fa-plus',
          tikla: function(){ setTimeout(function(){ bulguEkle(d.id); }, 280); } },
        { etiket:'DÖF Aç', sinif:'btn-acc', ikon:'fa-screwdriver-wrench',
          tikla: function(){ setTimeout(function(){ dofAc(d); }, 280); } }
      ]
    });
  }

  /* ---------------- bulgu ekleme modalı ---------------- */
  function bulguEkle(id){
    var d = kayitBul(id);
    gvModalForm({
      baslik:'Bulgu ekle', ikon:'fa-plus', genislik:'gv-modal-lg',
      metin:'<b>' + GV.esc(d.id) + '</b> denetimine yeni bulgu kaydedilecek.',
      govde:'<div class="gform">'
        + '<div class="gfield"><label for="bgSinif">Bulgu sınıfı *</label>'
        + '<select id="bgSinif"><option value="major">Major uygunsuzluk</option>'
        + '<option value="minor" selected>Minor uygunsuzluk</option>'
        + '<option value="gozlem">Gözlem</option></select></div>'
        + '<div class="gfield"><label for="bgMadde">İlgili madde / doküman</label>'
        + '<select id="bgMadde"><option value="">Seçilmedi</option>'
        + A.liste('kaliteDokumanlari').filter(function(k){ return k.durum === 'yayinda'; })
            .map(function(k){ return '<option value="' + GV.esc(k.id) + '">' + GV.esc(k.kod + ' · ' + k.ad) + '</option>'; }).join('')
        + '</select></div>'
        + '<div class="gfield full"><label for="bgAciklama">Bulgu açıklaması *</label>'
        + '<textarea id="bgAciklama" placeholder="Tespit edilen uygunsuzluğun tanımı…"></textarea></div>'
        + '<div class="gfield full"><label class="lh-toggle" for="bgDof"><input type="checkbox" id="bgDof" checked> Bu bulgu için düzeltici faaliyet aç</label>'
        + '<span class="gf-hint">Major bulgularda düzeltici faaliyet açılması zorunludur.</span></div>'
        + '</div>',
      sema: {
        bgSinif:     { etiket:'Bulgu sınıfı', zorunlu:true },
        bgMadde:     { etiket:'İlgili madde / doküman' },
        bgAciklama:  { etiket:'Bulgu açıklaması', zorunlu:true, enAz:10, enCok:600 }
      },
      ad:'AddAuditFinding',
      onayEtiket:'Bulguyu Kaydet', onayIkon:'fa-check',
      gonder: function(v, yardim){
        var madde = v.bgMadde ? A.kayit('kaliteDokumanlari', v.bgMadde) : null;
        var maddeMetin = madde ? ' (İlgili doküman: ' + madde.kod + ' · ' + madde.ad + ')' : '';
        var dofIster = yardim.kap.querySelector('#bgDof').checked || v.bgSinif === 'major';
        var sayac = {};
        if (v.bgSinif === 'gozlem') sayac.gozlem = (d.gozlem || 0) + 1;
        else {
          sayac.bulguSayisi = (d.bulguSayisi || 0) + 1;
          if (v.bgSinif === 'major') sayac.majorSayisi = (d.majorSayisi || 0) + 1;
          else sayac.minorSayisi = (d.minorSayisi || 0) + 1;
        }
        /* Sayaç güncellemesi ile durum geçişi AYRI işlerdir. */
        return A.guncelle('denetimler', d.id, sayac).then(function(){
          return GV.gecisUygula('denetim', 'denetimler', d.id, 'acik', {
            sessiz:true, not:'İlk bulgu kaydedildi.' });
        }).then(function(){
          A.kayitAt('bulgu-ekleme', 'Denetim', d.id, GV.n(d.bulguSayisi),
            GV.n(sayac.bulguSayisi != null ? sayac.bulguSayisi : d.bulguSayisi),
            (v.bgSinif === 'major' ? 'Major' : v.bgSinif === 'minor' ? 'Minor' : 'Gözlem')
            + ': ' + v.bgAciklama + maddeMetin);
          if (!dofIster) return null;
          return A.ekle('duzelticiFaaliyetler', {
            id: yeniKod('duzelticiFaaliyetler', 'DOF-2026'),
            kaynak: d.tur, kaynakId: d.id,
            baslik: v.bgAciklama.length > 70 ? v.bgAciklama.substring(0, 70) + '…' : v.bgAciklama,
            aciklama: v.bgAciklama + maddeMetin, kokNeden:'Kök neden analizi yapılacak.',
            faaliyet:'Faaliyet planı hazırlanacak.',
            sorumluId: d.denetciId || 'PRS-005', acilis: BUGUN, termin: null,
            kapanis: null, durum:'acik', etkinlik: null
          });
        }).then(function(){
          gvToast(dofIster ? 'Bulgu kaydedildi ve düzeltici faaliyet açıldı.' : 'Bulgu kaydedildi.',
            { ton: v.bgSinif === 'major' ? 'warn' : 'ok' });
          setTimeout(function(){ location.reload(); }, 900);
        });
      }
    });
  }

  /* ---------------- DÖF açma modalı ---------------- */
  function dofAc(d){
    gvModalForm({
      baslik:'Düzeltici faaliyet aç', ikon:'fa-screwdriver-wrench', genislik:'gv-modal-lg',
      metin:'<b>' + GV.esc(d.id) + '</b> denetimi kaynak olarak bağlanacak.',
      govde:'<div class="gform">'
        + '<div class="gfield full"><label for="dfBaslik">Faaliyet başlığı *</label>'
        + '<input type="text" id="dfBaslik" value="' + GV.esc(d.kapsam) + '" placeholder="Faaliyetin kısa tanımı"></div>'
        + '<div class="gfield full"><label for="dfKok">Kök neden</label>'
        + '<textarea id="dfKok" placeholder="Bulgunun kök nedeni"></textarea></div>'
        + '<div class="gfield full"><label for="dfFaaliyet">Planlanan faaliyet</label>'
        + '<textarea id="dfFaaliyet" placeholder="Yapılacak düzeltici faaliyet"></textarea></div>'
        + '<div class="gfield"><label for="dfSorumlu">Sorumlu</label><select id="dfSorumlu">'
        + A.liste('personeller').filter(function(p){ return p.durum === 'aktif'; })
            .map(function(p){ return '<option value="' + p.id + '"' + (p.id === (d.denetciId || 'PRS-005') ? ' selected' : '') + '>'
              + GV.esc(p.ad + ' — ' + p.birim) + '</option>'; }).join('') + '</select></div>'
        + '<div class="gfield"><label for="dfTermin">Termin</label><input type="date" id="dfTermin"></div>'
        + '</div>',
      sema: {
        dfBaslik:   { etiket:'Faaliyet başlığı', zorunlu:true, enAz:5, enCok:160 },
        dfKok:      { etiket:'Kök neden', enCok:600 },
        dfFaaliyet: { etiket:'Planlanan faaliyet', enCok:600 },
        dfSorumlu:  { etiket:'Sorumlu', zorunlu:true },
        dfTermin:   { etiket:'Termin', tur:'tarih', enAz: BUGUN }
      },
      ad:'OpenCorrectiveAction',
      onayEtiket:'DÖF Aç', onayIkon:'fa-check',
      gonder: function(v){
        return A.ekle('duzelticiFaaliyetler', {
          id: yeniKod('duzelticiFaaliyetler', 'DOF-2026'),
          kaynak: d.tur, kaynakId: d.id, baslik: v.dfBaslik,
          aciklama: d.kapsam,
          kokNeden: v.dfKok || 'Kök neden analizi yapılacak.',
          faaliyet: v.dfFaaliyet || 'Faaliyet planı hazırlanacak.',
          sorumluId: v.dfSorumlu, acilis: BUGUN,
          termin: v.dfTermin || null,
          kapanis: null, durum:'acik', etkinlik: null
        }).then(function(){
          gvToast('Düzeltici faaliyet açıldı.', { ton:'ok' });
          setTimeout(function(){ location.href = GV.href('duzeltici-faaliyetler.html'); }, 900);
        });
      }
    });
  }

  /* ---------------- yeni denetim ---------------- */
  document.getElementById('dnYeni').addEventListener('click', function(){
    var birimler = ['Operasyon','Teknik','Kalite','Finans','Satış','Bilgi Sistemleri','Tüm süreçler'];
    gvModalForm({
      baslik:'Yeni denetim planla', ikon:'fa-calendar-plus', genislik:'gv-modal-lg',
      metin:'Planlanan denetim kalite programına eklenir; bulgular denetim gerçekleştikten sonra girilir.',
      govde:'<div class="gform">'
        + '<div class="gfield"><label for="ydTur">Denetim türü *</label><select id="ydTur">'
        + TURLER.map(function(t){ return '<option value="' + GV.esc(t.ad) + '">' + GV.esc(t.ad) + '</option>'; }).join('')
        + '</select></div>'
        + '<div class="gfield"><label for="ydTarih">Denetim tarihi *</label><input type="date" id="ydTarih" value="' + BUGUN + '"></div>'
        + '<div class="gfield full"><label for="ydKapsam">Kapsam *</label>'
        + '<input type="text" id="ydKapsam" placeholder="Denetlenecek süreç ve faaliyetler"></div>'
        + '<div class="gfield"><label for="ydDenetci">Denetçi</label><select id="ydDenetci">'
        + '<option value="">Dış denetçi kuruluş</option>'
        + A.liste('personeller').filter(function(p){ return p.durum === 'aktif'; })
            .map(function(p){ return '<option value="' + p.id + '"' + (p.id === 'PRS-005' ? ' selected' : '') + '>'
              + GV.esc(p.ad + ' — ' + p.gorev) + '</option>'; }).join('') + '</select>'
        + '<span class="gf-hint">Dış denetimlerde denetçi boş bırakılır.</span></div>'
        + '<div class="gfield"><label for="ydBirim">Denetlenen birim *</label><select id="ydBirim">'
        + '<optgroup label="Birimler">'
        + birimler.map(function(b){ return '<option value="' + GV.esc(b) + '">' + GV.esc(b) + '</option>'; }).join('')
        + '</optgroup><optgroup label="Taşeronlar">'
        + A.liste('taseronlar').map(function(t){ return '<option value="' + t.id + '">' + GV.esc(t.kisaAd) + '</option>'; }).join('')
        + '</optgroup></select></div>'
        + '</div>',
      sema: {
        ydTur:     { etiket:'Denetim türü', zorunlu:true },
        ydTarih:   { etiket:'Denetim tarihi', tur:'tarih', zorunlu:true },
        ydKapsam:  { etiket:'Kapsam', zorunlu:true, enAz:5, enCok:200 },
        ydDenetci: { etiket:'Denetçi' },
        ydBirim:   { etiket:'Denetlenen birim', zorunlu:true }
      },
      ad:'PlanAudit',
      onayEtiket:'Denetimi Planla', onayIkon:'fa-check',
      gonder: function(v){
        return A.ekle('denetimler', {
          id: yeniKod('denetimler', 'DNT-2026'),
          tur: v.ydTur, kapsam: v.ydKapsam, tarih: v.ydTarih,
          denetciId: v.ydDenetci || null,
          denetlenenBirim: v.ydBirim,
          bulguSayisi: 0, majorSayisi: 0, minorSayisi: 0, gozlem: 0,
          durum:'planlandi', rapor: null
        }).then(function(){
          gvToast('Denetim planlandı.', { ton:'ok' });
          setTimeout(function(){ location.reload(); }, 900);
        });
      }
    });
  });

  document.getElementById('dnDisa').addEventListener('click', function(){
    GV.disaAktar({ kayitSayisi: liste.sonuc().pagination.totalRecords, dosyaAdi:'denetimler', modul:'Denetim' });
  });

  /* ---------------- filtre ---------------- */
  

  /* ---------------- grafikler ---------------- */
  var donutVeri = [
    { etiket:'Major', deger: topla(kaynak, 'majorSayisi'), ton:'danger' },
    { etiket:'Minor', deger: topla(kaynak, 'minorSayisi'), ton:'warn' },
    { etiket:'Gözlem', deger: topla(kaynak, 'gozlem'), ton:'info' }
  ].filter(function(x){ return x.deger; });
  if (donutVeri.length) gvDonut('#dnDonut', donutVeri, { merkezEtiket:'bulgu ve gözlem' });
  else document.getElementById('dnDonut').innerHTML = gvEmpty({ ikon:'fa-circle-check',
    baslik:'Bulgu kaydı yok', metin:'Kayıtlı denetimlerde henüz bulgu veya gözlem girilmedi.' });

  gvBar('#dnTurBar', TURLER.map(function(t){
    var alt = kaynak.filter(function(d){ return d.turK === t.k; });
    return { etiket: t.ad, deger: topla(alt, 'bulguSayisi'),
      ton: t.k === 'taseron' ? 'warn' : t.k === 'dis' ? 'mor' : 'acc' };
  }), { baslik:'Denetim türüne göre bulgu sayısı', birim:'bulgu', yukseklik:220 });

  var birimSay = {};
  kaynak.forEach(function(d){
    if (!birimSay[d.birimAd]) birimSay[d.birimAd] = { bulgu:0, major:0, denetim:0 };
    birimSay[d.birimAd].bulgu += d.bulguSayisi || 0;
    birimSay[d.birimAd].major += d.majorSayisi || 0;
    birimSay[d.birimAd].denetim++;
  });
  gvBarList('#dnBirim', Object.keys(birimSay)
    .sort(function(a,b){ return birimSay[b].bulgu - birimSay[a].bulgu; })
    .map(function(b){
      return { etiket: b, deger: birimSay[b].bulgu,
        gosterim: GV.n(birimSay[b].bulgu) + ' bulgu / ' + GV.n(birimSay[b].denetim) + ' denetim',
        ton: birimSay[b].major ? 'danger' : birimSay[b].bulgu ? 'warn' : 'ok' };
    }));
})();
</script>
</body>
</html>
