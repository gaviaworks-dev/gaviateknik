<!DOCTYPE html>
<html lang="tr">
<head>
<title>Faturalar — GAVIA Periyodik Kontrol Yönetimi</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="assets/css/gavia-ui.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/print.css">
</head>
<body data-sec="ticari" data-screen="faturalar">
<div class="gv-app">
  <aside class="gv-rail" id="gvRail" aria-label="Modül menüsü"></aside>
  <nav class="gv-menu" id="gvMenu" aria-label="Sayfa menüsü"></nav>
  <div class="gv-divider" id="gvDivider" role="separator" aria-label="Menüyü daralt/genişlet"><span class="gv-grip"></span></div>
  <div class="gv-overlay" id="gvOverlay"></div>
  <header class="gv-top" id="gvTop"></header>

  <main class="gv-main">
    <div class="gv-page-head">
      <div>
        <div class="ph-eyebrow">Ticari Süreçler</div>
        <h1>Faturalar</h1>
        <p class="ph-sub">Kesilen bütün faturalar; ara toplam, KDV, tahsil edilen ve kalan tutarlarla. Kısmi faturalarda kalan miktarlar mutabakat tablosunda izlenir.</p>
      </div>
      <div class="ph-actions no-print"><button class="btn btn-ghost" type="button" id="ftDisa"><i class="fa-solid fa-file-export" aria-hidden="true"></i>Dışa Aktar</button>
      <a class="btn btn-acc" href="fatura-gruplari.html"><i class="fa-solid fa-layer-group" aria-hidden="true"></i>Fatura Grupları</a></div>
    </div>
    <div class="kpi-grid" id="ftKpi"></div>
    <section class="gv-card">
            <div class="gv-listhead no-print">
        <div class="lh-row">
          <div class="lh-search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <label class="gv-sr" for="gvSearch">Listede ara</label>
            <input type="search" id="gvSearch" placeholder="Fatura no, müşteri, açıklama…" autocomplete="off">
          </div>
          <div class="lh-acts">
            
            <button class="btn btn-sm btn-ghost gv-fp-open" type="button" id="gvFilterBtn">
              <i class="fa-solid fa-filter" aria-hidden="true"></i>Gelişmiş Filtre<span class="fp-count" id="gvFpCount" hidden>0</span>
            </button>
            <button class="btn btn-sm btn-ghost" type="button" id="gvColsBtn"><i class="fa-solid fa-table-columns" aria-hidden="true"></i>Kolonlar</button>
            <label class="lh-toggle"><input type="checkbox" id="gvArsiv"> Arşivlenenleri göster</label>
          </div>
        </div>
        <div class="lh-chiprow"><div class="chips" id="gvChips"></div></div>
      </div>
      <div class="gv-achips-row no-print" id="gvAchips" hidden></div>
      <div id="ftBulk"></div>
      <div class="gc-body flush" id="ftTablo"></div>
      <div class="gv-pager" id="ftPager" hidden></div>
    </section>
    <div id="ftDetayKap"></div>
  </main>
</div>
<script src="assets/js/kimlik.js"></script>
<script src="assets/js/para-zaman.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="assets/js/demo-api.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/durum-makinesi.js"></script>
<script src="assets/js/form-controller.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/filters.js"></script>
<script src="assets/js/forms.js"></script>
<script src="assets/js/types.js"></script>
<script src="assets/js/data-provider.js"></script>
<script src="assets/js/list-controller.js"></script>
<script src="assets/js/tooltip.js"></script>
<script>
(function(){
  var A = window.demoApi, BUGUN = A.bugun();
  var kapsam = A.rolKapsami(GV.rol);

  var kaynak = A.liste('faturalar').filter(function(f){
    return kapsam.tur !== 'musteri' || f.musteriId === kapsam.musteriId;
  }).map(function(f){
    var m = A.kayit('musteriler', f.musteriId), p = f.projeId ? A.kayit('projeler', f.projeId) : null;
    var g = f.grupId ? A.kayit('faturaGruplari', f.grupId) : null;
    var satir = A.liste('faturaSatirlari').filter(function(s){ return s.faturaId === f.id; });
    var kismiMi = satir.some(function(s){ return s.kalanMiktar > 0; });
    return Object.assign({}, f, {
      musteriAd: m ? m.kisaAd : '—', projeKod: p ? p.kod : '—', grupAd: g ? g.ad : null,
      satirSayisi: satir.length, kismiMi: kismiMi,
      gecikmeGun: f.kalan > 0 ? GV.gun(BUGUN, f.vade) : null,
      tahsilOran: f.toplam ? f.tahsilEdilen / f.toplam : 0
    });
  }).sort(function(a,b){ return String(b.tarih).localeCompare(String(a.tarih)); });

  gvKpi('#ftKpi', [
    { ikon:'fa-file-invoice-dollar', sayi: GV.n(kaynak.length), etiket:'Kesilen fatura',
      delta:{ yon:'flat', metin: kaynak.filter(function(f){ return f.kismiMi; }).length + ' kısmi fatura' } },
    /* Doküman §8: farklı para birimleri tek toplamda BİRLEŞMEZ.
       Karışık kayıt varsa toplam '₺… + €…' biçiminde ayrışık gösterilir. */
    { ikon:'fa-coins', sayi: GV.paraToplam(kaynak, 'toplam').metin(0), etiket:'Toplam fatura tutarı' },
    { ikon:'fa-money-bill-transfer', sayi: GV.paraToplam(kaynak, 'tahsilEdilen').metin(0),
      etiket:'Tahsil edilen', ton:'ok' },
    { ikon:'fa-triangle-exclamation', sayi: GV.paraToplam(kaynak, 'kalan').metin(0),
      etiket:'Açık bakiye', ton: kaynak.some(function(f){ return f.tahsilatDurum === 'vadesi-gecti'; }) ? 'danger' : 'warn',
      delta:{ yon:'down', metin: kaynak.filter(function(f){ return f.tahsilatDurum === 'vadesi-gecti'; }).length + ' fatura vadesi geçti' } }
  ]);

  var kolonlar = [
    { k:'no', ad:'Fatura No', kilitli:true, ciz: function(f){
        return '<div class="gcell-info"><div class="gcell-name">'
          + '<button type="button" class="btn-link" data-fatura-ac="' + f.id + '">' + GV.esc(f.no) + '</button>'
          + (f.kismiMi ? ' <span class="gtag warn"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>Kısmi</span>' : '') + '</div>'
          + '<div class="gcell-sub">' + GV.esc(f.aciklama) + '</div></div>'; } },
    { k:'musteriAd', ad:'Müşteri', ciz: function(f){
        return '<a href="musteri-detay.html?id=' + f.musteriId + '">' + GV.esc(f.musteriAd) + '</a>'; } },
    { k:'projeKod', ad:'Proje', ciz: function(f){
        return f.projeId ? '<a href="proje-detay.html?id=' + f.projeId + '">' + GV.esc(f.projeKod) + '</a>' : '<span class="muted">—</span>'; } },
    { k:'grupAd', ad:'Fatura Grubu', varsayilanGizli:true, gizli:true, ciz: function(f){
        return f.grupId ? '<a href="fatura-grubu-detay.html?id=' + f.grupId + '">' + GV.esc(f.grupAd) + '</a>' : '<span class="muted">Grupsuz</span>'; } },
    { k:'tarih', ad:'Fatura Tarihi', ciz: function(f){ return GV.d(f.tarih); } },
    { k:'vade', ad:'Vade', ciz: function(f){
        return GV.d(f.vade) + (f.gecikmeGun != null && f.gecikmeGun < 0
          ? ' ' + GV.rozetOzel('danger','fa-clock', Math.abs(f.gecikmeGun) + ' gün') : ''); } },
    { k:'araToplam', ad:'Ara Toplam', sinif:'num', ciz: function(f){ return GV.tl(f.araToplam); } },
    { k:'kdv', ad:'KDV', sinif:'num', varsayilanGizli:true, gizli:true, ciz: function(f){ return GV.tl(f.kdv); } },
    { k:'toplam', ad:'Genel Toplam', sinif:'num', ciz: function(f){ return '<b class="t-strong">' + GV.tl(f.toplam) + '</b>'; } },
    { k:'tahsilEdilen', ad:'Tahsil Edilen', sinif:'num', ciz: function(f){ return GV.tl(f.tahsilEdilen); } },
    { k:'kalan', ad:'Kalan', sinif:'num', ciz: function(f){
        return f.kalan ? '<b style="color:var(--danger)">' + GV.tl(f.kalan) + '</b>' : GV.tl(0); } },
    { k:'tahsilOran', ad:'Tahsilat', ciz: function(f){ return GV.bar(f.tahsilOran, { etiket: GV.pct(f.tahsilOran, true, 0) }); } },
    { k:'tahsilatDurum', ad:'Tahsilat Durumu', ciz: function(f){ return GV.rozet('tahsilat', f.tahsilatDurum); } },
    { k:'__islem', ad:'İşlem', ciz: function(f){
        return '<div class="row-acts">'
          + '<button class="ia-btn" type="button" data-fatura-ac="' + f.id + '" aria-label="' + GV.esc(f.no) + ' detayı">'
          + '<i class="fa-solid fa-eye" aria-hidden="true"></i></button>'
          + '<a class="ia-btn" href="tahsilatlar.html?id=' + f.id + '" aria-label="' + GV.esc(f.no) + ' tahsilat">'
          + '<i class="fa-solid fa-money-bill-transfer" aria-hidden="true"></i></a>'
          + '<button class="ia-btn" type="button" data-fatura-yazdir="' + f.id + '" aria-label="' + GV.esc(f.no) + ' yazdır">'
          + '<i class="fa-solid fa-print" aria-hidden="true"></i></button></div>'; } }
  ];

  

  var bulk = gvBulk({ hedef:'#ftBulk', aksiyonlar:[
    { etiket:'Dışa aktar', ikon:'fa-file-export', tikla: function(s){ GV.disaAktar({ kayitSayisi:s.length, dosyaAdi:'faturalar', modul:'Fatura' }); } },
    { etiket:'Hatırlatma gönder', ikon:'fa-bell', tikla: function(s){
        var acik = s.filter(function(fid){ var f = A.kayit('faturalar', fid); return f && f.kalan > 0; });
        if (!acik.length) { gvToast('Seçilen faturaların tamamı tahsil edilmiş.', { ton:'info' }); return; }
        gvConfirm({ baslik:'Ödeme hatırlatması gönderilsin mi?',
          metin:'<b>' + acik.length + '</b> fatura için müşteriye ödeme hatırlatması gönderilecek.',
          onayEtiket:'Gönder', onayIkon:'fa-bell' }).then(function(r){
            if (!r.onay) return;
            Promise.all(acik.map(function(fid){
              var f = A.kayit('faturalar', fid);
              return A.ekle('iletisimGecmisi', {
                id:GV.yeniKod('ILT-FT'),
                musteriId: f.musteriId, lokasyonId: null, kisiId: null,
                tur:'fatura-bildirimi', tarih: BUGUN + 'T10:00:00',
                kullaniciId: (GV.rolBilgi || {}).personelId,
                konu:'Ödeme hatırlatması — ' + f.no,
                ozet:'Vade ' + GV.d(f.vade) + ', kalan bakiye ' + GV.tl(f.kalan) + '.'
              });
            })).then(function(){ gvToast(acik.length + ' fatura için hatırlatma gönderildi.', { ton:'ok' }); });
          });
      } }
  ]});

  gvCols({ tetik:'#gvColsBtn', anahtar:'faturalar', kolonlar:kolonlar, degisti: function(){ liste.yenile(); } });
  var liste = gvList({
    kaynak: 'faturalar',
    veri: function(){ return kaynak; },
    arama: ['no','musteriAd','aciklama','projeKod'],
    cipler: { alan:'tahsilatDurum', secenekler: A.durumListesi('tahsilat').map(function(d){
      return { k:d.k, ad:d.ad, ikon:d.ikon }; }) },
    alanlar: [
      { k:'musteriId', ad:'Müşteri', tur:'coklu', secenekler: A.liste('musteriler').map(function(x){ return { deger:x.id, ad:x.kisaAd }; }) },
      { k:'projeId', ad:'Proje', tur:'coklu', secenekler: A.liste('projeler').map(function(p){ return { deger:p.id, ad:p.kod }; }) },
      { k:'tarih', ad:'Fatura tarihi', tur:'tarih' },
      { k:'toplam', ad:'Tutar (₺)', tur:'aralik' },
      { k:'kismiMi', ad:'Yalnız kısmi faturalar', tur:'toggle', secenekler:[{deger:'evet',ad:'Evet'},{deger:'hayir',ad:'Hayır'}] }
    ],
    tablo: { hedef: '#ftTablo',
      kolonlar: kolonlar,
      secim: true,
      satirId: function(f){ return f.id; },
      secimDegisti: function(s){ bulk.ciz(s); },
      altToplam: function(v){
      return '<tr><td data-lbl="" colspan="5">Toplam</td>'
        + '<td class="num">' + GV.tl(v.reduce(function(t,f){ return t + f.araToplam; }, 0)) + '</td>'
        + '<td class="num">' + GV.tl(v.reduce(function(t,f){ return t + f.toplam; }, 0)) + '</td>'
        + '<td class="num">' + GV.tl(v.reduce(function(t,f){ return t + f.tahsilEdilen; }, 0)) + '</td>'
        + '<td class="num">' + GV.tl(v.reduce(function(t,f){ return t + f.kalan; }, 0)) + '</td>'
        + '<td colspan="3"></td></tr>';
    } },
    pager: { hedef: '#ftPager', boyut: 20, boyutSecici: true },
    filtreBosDurum: { ikon:'fa-file-invoice-dollar', baslik:'Fatura bulunamadı', metin:'Filtrelerinize uyan fatura yok.' },
    bosDurum: { ikon:'fa-file-invoice-dollar', baslik:'Faturalar listesi boş', metin:'Bu modülde henüz kayıt oluşturulmamış.' },
    degisti: function(){
      document.querySelectorAll('[data-fatura-ac]').forEach(function(b){
      b.addEventListener('click', function(){ faturaAc(b.getAttribute('data-fatura-ac')); });
    });
    document.querySelectorAll('[data-fatura-yazdir]').forEach(function(b){
      b.addEventListener('click', function(){ faturaAc(b.getAttribute('data-fatura-yazdir'), true); });
    });
    }
  });
  



  function faturaAc(fid, yazdir){
    var f = A.kayit('faturalar', fid);
    var m = A.kayit('musteriler', f.musteriId);
    var satirlar = A.liste('faturaSatirlari').filter(function(s){ return s.faturaId === fid; });
    var firma = A.firma();

    var govde = '<div class="pr-doc" style="box-shadow:none;border:none;padding:0">'
      + '<div class="pr-head"><div class="pr-brand"><div class="pr-logo">G</div>'
      + '<div class="pr-brand-txt"><b>' + GV.esc(firma.unvan) + '</b><span>' + GV.esc(firma.adres) + '</span></div></div>'
      + '<div class="pr-meta"><h2>HİZMET FATURASI</h2>'
      + '<div class="pr-meta-line"><b>Fatura No:</b> ' + GV.esc(f.no) + '</div>'
      + '<div class="pr-meta-line"><b>Tarih:</b> ' + GV.dUzun(f.tarih) + '</div>'
      + '<div class="pr-meta-line"><b>Vade:</b> ' + GV.dUzun(f.vade) + '</div></div></div>'
      + '<div class="pr-sec"><div class="pr-sec-h">MÜŞTERİ BİLGİLERİ</div>'
      + '<table class="pr-tablo"><tbody>'
      + '<tr><th scope="row" style="width:24%">Unvan</th><td>' + GV.esc(m ? m.unvan : '—') + '</td></tr>'
      + '<tr><th scope="row">Vergi Dairesi / No</th><td>' + GV.esc(m ? m.vergiDairesi + ' / ' + m.vergiNo : '—') + '</td></tr>'
      + '<tr><th scope="row">Adres</th><td>' + GV.esc(m ? m.adres : '—') + '</td></tr></tbody></table></div>';

    if (satirlar.length) {
      govde += '<div class="pr-sec"><div class="pr-sec-h">FATURA KALEMLERİ</div>'
        + '<table class="pr-tablo"><thead><tr><th scope="col">Lokasyon</th><th scope="col">Hizmet</th>'
        + '<th scope="col">Bu Fatura</th><th scope="col">Kalan</th>'
        + '<th scope="col">Birim Fiyat</th><th scope="col">Tutar</th></tr></thead><tbody>'
        + satirlar.map(function(s){
            var l = A.lokasyon(s.lokasyonId), h = A.kayit('hizmetler', s.hizmetId);
            return '<tr><td>' + GV.esc(l ? l.ad : s.lokasyonId) + '</td>'
              + '<td>' + GV.esc(h ? h.poz + ' · ' + h.ad : s.hizmetId) + '</td>'
              + '<td>' + GV.n(s.buFaturaMiktar) + '</td>'
              + '<td>' + (s.kalanMiktar ? '<b>' + GV.n(s.kalanMiktar) + '</b>' : '0') + '</td>'
              + '<td>' + GV.tl(s.birimFiyat) + '</td><td>' + GV.tl(s.tutar) + '</td></tr>';
          }).join('') + '</tbody></table></div>';
    }

    govde += '<div class="pr-sec"><table class="pr-tablo" style="max-width:340px;margin-left:auto"><tbody>'
      + '<tr><th scope="row">Ara Toplam</th><td style="text-align:right">' + GV.tl(f.araToplam) + '</td></tr>'
      + '<tr><th scope="row">KDV (%' + Math.round(f.kdvOran * 100) + ')</th><td style="text-align:right">' + GV.tl(f.kdv) + '</td></tr>'
      + '<tr><th scope="row">Genel Toplam</th><td style="text-align:right"><b>' + GV.tl(f.toplam) + '</b></td></tr>'
      + '<tr><th scope="row">Tahsil Edilen</th><td style="text-align:right">' + GV.tl(f.tahsilEdilen) + '</td></tr>'
      + '<tr><th scope="row">Kalan Bakiye</th><td style="text-align:right"><b>' + GV.tl(f.kalan) + '</b></td></tr>'
      + '</tbody></table></div>'
      + (satirlar.some(function(s){ return s.kalanMiktar > 0; })
        ? '<div class="gv-note warn"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>'
          + '<span><b>Kısmi fatura.</b> Kalan miktarlar mutabakat tablosunda izlenmeye devam eder ve '
          + 'sonraki faturaya aktarılır. Lokasyon adı değiştirilmemiş, yeni lokasyon açılmamıştır.</span></div>' : '')
      + '<div class="pr-notes">Bu belge demo amaçlı üretilmiştir; gerçek bir mali belge değildir.</div></div>';

    gvModal({
      baslik: f.no, ikon:'fa-file-invoice-dollar', genislik:'gv-modal-xl',
      govde: govde,
      butonlar:[{ etiket:'Kapat', sinif:'btn-ghost' },
        { etiket:'Tahsilat Kaydet', sinif:'btn-ghost', ikon:'fa-money-bill-transfer', tikla: function(){
            location.href = GV.href('tahsilatlar.html?id=' + fid); } },
        { etiket:'Yazdır', sinif:'btn-acc', ikon:'fa-print', kapat:false, tikla: function(){ window.print(); } }]
    });
    if (yazdir) setTimeout(function(){ window.print(); }, 400);
  }

  

  document.getElementById('ftDisa').addEventListener('click', function(){
    GV.disaAktar({ kayitSayisi: liste.sonuc().pagination.totalRecords, dosyaAdi:'faturalar', modul:'Fatura' });
  });

  var acilis = GV.q('id');
  if (acilis && A.kayit('faturalar', acilis)) setTimeout(function(){ faturaAc(acilis); }, 300);
})();
</script>
</body>
</html>
