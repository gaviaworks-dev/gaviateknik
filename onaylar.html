<!DOCTYPE html>
<html lang="tr">
<head>
<title>Bekleyen Onaylar — GAVIA Periyodik Kontrol Yönetimi</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="assets/css/gavia-ui.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/print.css">
</head>
<body data-sec="panel" data-screen="onaylar">
<div class="gv-app">
  <aside class="gv-rail" id="gvRail" aria-label="Modül menüsü"></aside>
  <nav class="gv-menu" id="gvMenu" aria-label="Sayfa menüsü"></nav>
  <div class="gv-divider" id="gvDivider" role="separator" aria-label="Menüyü daralt/genişlet"><span class="gv-grip"></span></div>
  <div class="gv-overlay" id="gvOverlay"></div>
  <header class="gv-top" id="gvTop"></header>

  <main class="gv-main">
    <div class="gv-page-head">
      <div>
        <div class="ph-eyebrow">Ana Panel</div>
        <h1>Bekleyen Onaylar</h1>
        <p class="ph-sub">Teknik rapor onayı, hakediş onayı, taşeron ödeme onayı ve yeniden kontrol talepleri. Her kayıtta onay zinciri ve karar butonları yer alır.</p>
      </div>
      <div class="ph-actions no-print"><button class="btn btn-ghost" type="button" data-yazdir><i class="fa-solid fa-print" aria-hidden="true"></i>Yazdır</button></div>
    </div>
    <div class="kpi-grid" id="onKpi"></div>

    <section class="gv-card">
            <div class="gv-listhead no-print">
        <div class="lh-row">
          <div class="lh-search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <label class="gv-sr" for="gvSearch">Listede ara</label>
            <input type="search" id="gvSearch" placeholder="Onaylarda ara — kayıt no, lokasyon, müşteri…" autocomplete="off">
          </div>
          <div class="lh-acts">
            
            <button class="btn btn-sm btn-ghost gv-fp-open" type="button" id="gvFilterBtn">
              <i class="fa-solid fa-filter" aria-hidden="true"></i>Gelişmiş Filtre<span class="fp-count" id="gvFpCount" hidden>0</span>
            </button>
            
            
          </div>
        </div>
        <div class="lh-chiprow"><div class="chips" id="gvChips"></div></div>
      </div>
      <div class="gv-achips-row no-print" id="gvAchips" hidden></div>
      <div class="gc-body flush" id="onListe"></div>
      <div class="gv-pager" id="onPager" hidden></div>
    </section>
  </main>
</div>
<script src="assets/js/kimlik.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="assets/js/demo-api.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/durum-makinesi.js"></script>
<script src="assets/js/form-controller.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/filters.js"></script>
<script src="assets/js/forms.js"></script>
<script src="assets/js/types.js"></script>
<script src="assets/js/data-provider.js"></script>
<script src="assets/js/list-controller.js"></script>
<script src="assets/js/tooltip.js"></script>
<script>
(function(){
  var A = window.demoApi, BUGUN = A.bugun();
  var kaynak = [];

  A.raporlar().filter(function(r){ return r.durum === 'teknik-incelemede'; }).forEach(function(r){
    kaynak.push({ tur:'Teknik Rapor', ikon:'fa-file-lines', kod:r.no, id:r.id,
      baslik:'Teknik rapor onayı bekliyor', musteri:r.musteriAd, lokasyon:r.lokasyonAd,
      tutar:null, tarih:r.raporTarihi, sorumlu:'Teknik Yönetici',
      aciklama:'Kontrol ' + GV.d(r.kontrolTarihi) + ' tarihinde yapıldı, ' + r.uygunsuzlukSayisi + ' uygunsuzluk kaydedildi. Sonuç: '
        + (r.sonuc === 'uygun' ? 'uygun' : r.sonuc === 'sartli-uygun' ? 'şartlı uygun' : 'uygun değil') + '.',
      zincir:[{ad:'Saha kontrolü',ton:'ok',ikon:'fa-check'},{ad:'Rapor hazırlandı',ton:'ok',ikon:'fa-check'},
              {ad:'Teknik onay',ton:'warn',ikon:'fa-hourglass-half'},{ad:'Müşteri teslimi',ton:'',ikon:'fa-circle'}],
      sla: r.slaDurum, link:'rapor-detay.html?id=' + r.id, onay:'rapor' });
  });
  A.liste('hakedisler').filter(function(h){ return h.durum === 'onay-bekliyor'; }).forEach(function(h){
    var m = A.kayit('musteriler', h.musteriId), p = A.kayit('projeler', h.projeId);
    kaynak.push({ tur:'Hakediş', ikon:'fa-calculator', kod:h.no, id:h.id,
      baslik:'Müşteri hakedişi onayı bekliyor', musteri: m ? m.kisaAd : '—', lokasyon: p ? p.ad : '—',
      tutar:null, tarih:h.tarih, sorumlu:'Operasyon Yöneticisi',
      aciklama: h.donem + ' dönemi · ' + h.lokasyonSayisi + ' lokasyon. ' + h.not,
      zincir:[{ad:'Hazırlık',ton:'ok',ikon:'fa-check'},{ad:'Onay',ton:'warn',ikon:'fa-hourglass-half'},{ad:'Faturalama',ton:'',ikon:'fa-circle'}],
      sla:null, link:'hakedisler.html?id=' + h.id, onay:'hakedis' });
  });
  A.liste('taseronHakedisleri').filter(function(t){ return t.durum === 'odemeye-uygun'; }).forEach(function(t){
    var ts = A.kayit('taseronlar', t.taseronId);
    var kural = A.taseronOdenebilirMi(t.id);
    kaynak.push({ tur:'Taşeron Ödemesi', ikon:'fa-money-bill-transfer', kod:t.no, id:t.id,
      baslik:'Taşeron ödeme onayı bekliyor', musteri: ts ? ts.kisaAd : '—', lokasyon: t.donem + ' dönemi',
      tutar:t.tutar, tarih:t.tarih, sorumlu:'Finans ve Muhasebe',
      aciklama: t.not + (kural.uyari ? ' ' + kural.uyari : ''),
      zincir:[{ad:'Hakediş',ton:'ok',ikon:'fa-check'},{ad:'Taşeron faturası',ton:'ok',ikon:'fa-check'},
              {ad:'Ödeme onayı',ton:'warn',ikon:'fa-hourglass-half'},{ad:'Ödeme',ton:'',ikon:'fa-circle'}],
      sla:null, link:'taseron-hakedisleri.html?id=' + t.id, onay:'odeme' });
  });
  A.liste('yenidenKontroller').filter(function(y){ return y.durum === 'talep-edildi'; }).forEach(function(y){
    var l = A.lokasyon(y.lokasyonId), u = A.kayit('uygunsuzluklar', y.uygunsuzlukId);
    kaynak.push({ tur:'Yeniden Kontrol', ikon:'fa-rotate-right', kod:y.id, id:y.id,
      baslik:'Yeniden kontrol talebi onayı bekliyor', musteri: l ? l.musteriAd : '—', lokasyon: l ? l.ad : '—',
      tutar:null, tarih:y.talepTarihi, sorumlu:'Operasyon Yöneticisi',
      aciklama: y.aciklama + ' Talep eden: ' + y.talepEden + '. ' + (y.ucretli == null ? 'Ücret durumu belirlenecek.' : y.ucretli ? 'Ücretli kontrol kapsamında.' : 'Ücretsiz yeniden kontrol.')
        + (u ? ' İlgili uygunsuzluk: ' + u.baslik + '.' : ''),
      zincir:[{ad:'Talep',ton:'ok',ikon:'fa-check'},{ad:'Onay',ton:'warn',ikon:'fa-hourglass-half'},{ad:'Planlama',ton:'',ikon:'fa-circle'}],
      sla:null, link:'yeniden-kontroller.html?id=' + y.id, onay:'yeniden' });
  });
  A.liste('kaliteDokumanlari').filter(function(k){ return k.durum === 'onayda'; }).forEach(function(k){
    var h = A.kayit('personeller', k.hazirlayanId);
    kaynak.push({ tur:'Kalite Dokümanı', ikon:'fa-file-shield', kod:k.kod, id:k.id,
      baslik:'Kalite dokümanı yayın onayı bekliyor', musteri:'GAVIA Teknik', lokasyon: k.ad,
      tutar:null, tarih:null, sorumlu:'Genel Müdür',
      aciklama: k.ad + ' · ' + k.versiyon + ' · ' + k.sayfa + ' sayfa. Hazırlayan: ' + (h ? h.ad : '—') + '.',
      zincir:[{ad:'Hazırlık',ton:'ok',ikon:'fa-check'},{ad:'Yayın onayı',ton:'warn',ikon:'fa-hourglass-half'},{ad:'Yayın',ton:'',ikon:'fa-circle'}],
      sla:null, link:'kalite-dokumanlari.html?id=' + k.id, onay:'dokuman' });
  });

  gvKpi('#onKpi', [
    { ikon:'fa-stamp', sayi: GV.n(kaynak.length), etiket:'Toplam bekleyen onay' },
    { ikon:'fa-file-lines', sayi: GV.n(kaynak.filter(function(k){return k.tur==='Teknik Rapor';}).length), etiket:'Rapor onayı', ton:'warn' },
    { ikon:'fa-money-bill-transfer', sayi: GV.tlKisa(kaynak.reduce(function(t,k){return t+(k.tutar||0);},0)), etiket:'Onay bekleyen ödeme tutarı', ton:'info' },
    { ikon:'fa-hourglass-end', sayi: GV.n(kaynak.filter(function(k){return k.sla==='asildi';}).length), etiket:'SLA aşan onay', ton:'danger' }
  ]);

  var liste = document.getElementById('onListe');
  


  function ciz(sonuc, bos){
    var dilim = sonuc.data;
    liste.innerHTML = dilim.length ? dilim.map(function(o){
      var zincir = o.zincir.map(function(z){
        return '<span class="flow-step ' + (z.ton === 'ok' ? 'done' : z.ton === 'warn' ? 'now' : '') + '">'
          + '<i class="fa-solid ' + z.ikon + '" aria-hidden="true"></i>' + GV.esc(z.ad) + '</span>';
      }).join('<i class="fa-solid fa-chevron-right flow-sep" aria-hidden="true"></i>');
      return '<div class="akm-row" style="display:flex;align-items:flex-start;gap:14px;padding:17px 22px;border-bottom:1px solid var(--line)">'
        + '<span class="akm-ico" style="width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:15px;background:var(--warning-tint);color:var(--warning)">'
        + '<i class="fa-solid ' + o.ikon + '" aria-hidden="true"></i></span>'
        + '<div style="flex:1;min-width:0">'
        + '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px">'
        + '<span style="font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums">' + GV.esc(o.kod) + '</span>'
        + '<span class="gtag mint">' + GV.esc(o.tur) + '</span>'
        + (o.sla === 'asildi' ? GV.rozetOzel('danger','fa-hourglass-end','SLA aşıldı') : '')
        + (o.tutar ? '<span class="gtag">' + GV.tl(o.tutar) + '</span>' : '') + '</div>'
        + '<h3 style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px"><a href="' + o.link + '">' + GV.esc(o.baslik) + '</a></h3>'
        + '<p style="font-size:12.5px;color:var(--muted);line-height:1.55">' + GV.esc(o.aciklama) + '</p>'
        + '<div style="display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--muted)">'
        + '<span><i class="fa-solid fa-building" aria-hidden="true"></i> ' + GV.esc(o.musteri) + '</span>'
        + '<span><i class="fa-solid fa-location-dot" aria-hidden="true"></i> ' + GV.esc(o.lokasyon) + '</span>'
        + '<span><i class="fa-solid fa-user-gear" aria-hidden="true"></i> ' + GV.esc(o.sorumlu) + '</span>'
        + (o.tarih ? '<span><i class="fa-solid fa-calendar" aria-hidden="true"></i> ' + GV.d(o.tarih) + '</span>' : '') + '</div>'
        + '<div style="margin-top:10px">' + zincir + '</div></div>'
        + '<div style="flex:none;display:flex;flex-direction:column;gap:7px;align-items:flex-end">'
        + '<button class="btn btn-sm btn-acc" type="button" data-onayla="' + GV.esc(o.kod) + '" data-tur="' + GV.esc(o.tur) + '"><i class="fa-solid fa-check" aria-hidden="true"></i>Onayla</button>'
        + '<button class="btn btn-sm btn-ghost" type="button" data-reddet="' + GV.esc(o.kod) + '" data-tur="' + GV.esc(o.tur) + '">Reddet</button>'
        + '<a class="btn btn-sm btn-ghost" href="' + o.link + '">İncele</a></div></div>';
    }).join('') : gvEmpty(bos);

    liste.querySelectorAll('[data-onayla]').forEach(function(b){
      b.addEventListener('click', function(){
        gvConfirm({ baslik: b.getAttribute('data-tur') + ' onaylansın mı?',
          metin: '<b>' + b.getAttribute('data-onayla') + '</b> kaydı onaylanacak ve bir sonraki aşamaya geçecek. İşlem geçmişine kaydedilir.',
          onayEtiket:'Onayla', onayIkon:'fa-check', ton:'' }).then(function(s){
            if (!s.onay) return;
            A.kayitAt('onay', b.getAttribute('data-tur'), b.getAttribute('data-onayla'), 'Onay bekliyor', 'Onaylandı');
            gvToast(b.getAttribute('data-onayla') + ' onaylandı.', { ton:'ok' });
            b.closest('.akm-row').style.opacity = '.45';
            b.disabled = true;
          });
      });
    });
    liste.querySelectorAll('[data-reddet]').forEach(function(b){
      b.addEventListener('click', function(){
        gvConfirm({ baslik: b.getAttribute('data-tur') + ' reddedilsin mi?',
          metin: '<b>' + b.getAttribute('data-reddet') + '</b> kaydı bir önceki aşamaya döner. Ret gerekçesi zorunludur.',
          ton:'danger', onayEtiket:'Reddet', onayIkon:'fa-xmark', notAlani:true, notZorunlu:true,
          notYer:'Ret gerekçesini yazın…' }).then(function(s){
            if (!s.onay) return;
            A.kayitAt('ret', b.getAttribute('data-tur'), b.getAttribute('data-reddet'), 'Onay bekliyor', 'Reddedildi', s.not);
            gvToast(b.getAttribute('data-reddet') + ' reddedildi, gerekçe kaydedildi.', { ton:'warn' });
            b.closest('.akm-row').style.opacity = '.45';
          });
      });
    });
    GV.rolBaglantilariniIsle(liste);
  }


  var lc = gvList({
    kaynak: 'onaylar',
    veri: function(){ return kaynak; },
    arama: ['kod','baslik','musteri','lokasyon','aciklama'],
    cipler: { alan:'tur', secenekler: Array.from(new Set(kaynak.map(function(k){return k.tur;}))).map(function(t){
      return { k:t, ad:t }; }) },
    alanlar: [
      { k:'sorumlu', ad:'Sorumlu rol', tur:'secim', secenekler: Array.from(new Set(kaynak.map(function(k){return k.sorumlu;}))).map(function(t){ return { deger:t, ad:t }; }) },
      { k:'musteri', ad:'Müşteri / taraf', tur:'coklu', secenekler: Array.from(new Set(kaynak.map(function(k){return k.musteri;}))).map(function(t){ return { deger:t, ad:t }; }) }
    ],
    hedef: '#onListe',
    pager: { hedef: '#onPager', boyut: 10, boyutSecici: true },
    filtreBosDurum: { ikon:'fa-circle-check', baslik:'Bekleyen onay yok', metin:'Onayınızı bekleyen kayıt bulunmuyor.' },
    bosDurum: { ikon:'fa-circle-check', baslik:'Bekleyen Onaylar listesi boş', metin:'Bu modülde henüz kayıt oluşturulmamış.' },
    ciz: ciz
  });
  
})();
</script>
</body>
</html>
