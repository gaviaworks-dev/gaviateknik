<style>

.ld-harita{height:200px;border-radius:var(--radius-md);border:1px solid var(--line);position:relative;overflow:hidden;
  background-color:#EEF1F6;
  background-image:linear-gradient(rgba(205,210,222,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(205,210,222,.5) 1px,transparent 1px);
  background-size:34px 34px;display:grid;place-items:center;text-align:center;padding:20px}
.ld-harita .ld-pin{width:44px;height:44px;border-radius:50%;background:var(--gv-action);color:#fff;display:grid;place-items:center;font-size:18px;
  box-shadow:0 0 0 8px rgba(14,140,109,.16);margin:0 auto 10px}
.ld-harita p{font-size:12.5px;color:var(--ink-2);font-weight:600}
.ld-harita span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.ld-durumlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.ld-durum{padding:13px 15px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--bg)}
.ld-durum dt{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted);margin-bottom:7px}
</style>

<script>
(function(){
  var A = window.demoApi, BUGUN = A.bugun();
  var id = GV.q('id') || 'LOK-0101';
  var l = A.lokasyon(id);
  if (!l) { gvNotFound({ kod:id, listeHref:'lokasyonlar.html', listeEtiket:'Lokasyon listesi' }); return; }
  GV.crumb(l.kod);
  document.title = l.ad + ' — GAVIA Periyodik Kontrol Yönetimi';

  var proje = l.projeId ? A.kayit('projeler', l.projeId) : null;
  var hizmetler = A.lokasyonHizmetleri(l.id);
  var mutabakat = A.mutabakatSatirlari(l.id);
  var ekipmanlar = A.ekipmanlar().filter(function(e){ return e.lokasyonId === l.id; });
  var isEmirleri = A.isEmirleri().filter(function(i){ return i.lokasyonId === l.id; });
  var raporlar = A.raporlar().filter(function(r){ return r.lokasyonId === l.id; });
  var uygunsuzluklar = A.liste('uygunsuzluklar').filter(function(u){ return u.lokasyonId === l.id; });
  var kisiler = A.liste('iletisimKisileri').filter(function(k){ return k.lokasyonId === l.id || (k.musteriId === l.musteriId && !k.lokasyonId); });
  var faturaKontrol = A.lokasyonFaturalanabilirMi(l.id);

  document.getElementById('recHead').innerHTML =
    '<div class="rec-mark"><i class="fa-solid fa-' + (l.tur === 'Market' ? 'store' : l.tur === 'Fabrika' ? 'industry' : 'warehouse') + '" aria-hidden="true"></i></div>'
    + '<div class="rec-id"><div class="rc-code">' + GV.esc(l.kod + ' · müşteri kodu ' + l.musteriKod) + '</div>'
    + '<h1>' + GV.esc(l.ad) + '</h1>'
    + '<div class="rc-meta">' + GV.rozet('operasyon', l.operasyonDurum)
    + '<span><i class="fa-solid fa-building" aria-hidden="true"></i><a href="musteri-detay.html?id=' + l.musteriId + '">' + GV.esc(l.musteriAd) + '</a></span>'
    + '<span><i class="fa-solid fa-tags" aria-hidden="true"></i>' + GV.esc(l.markaAd) + '</span>'
    + '<span><i class="fa-solid fa-location-dot" aria-hidden="true"></i>' + GV.esc(l.ilce + ' / ' + l.il + ' · ' + l.bolge) + '</span>'
    + (proje ? '<span><i class="fa-solid fa-diagram-project" aria-hidden="true"></i><a href="proje-detay.html?id=' + proje.id + '">' + GV.esc(proje.kod) + '</a></span>'
             : '<span class="gtag warn"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>Hiçbir projede değil</span>') + '</div></div>'
    + '<div class="rec-acts no-print">'
    + '<a class="btn btn-ghost" href="lokasyonlar.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Listeye Dön</a>'
    + '<button class="btn btn-ghost" type="button" data-yazdir><i class="fa-solid fa-print" aria-hidden="true"></i>Yazdır</button>'
    + '<button class="btn btn-ghost" type="button" id="ldDurumBtn"><i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>Durum Değiştir</button>'
    + '<a class="btn btn-acc" href="lokasyon-form.html?id=' + l.id + '"><i class="fa-solid fa-pen" aria-hidden="true"></i>Düzenle</a></div>';

  gvTabs('.gv-tabbar');
  function sayac(k,n){ var e = document.getElementById('cnt_' + k); if (e) e.textContent = GV.n(n); }
  sayac('kisi', kisiler.length); sayac('kapsam', hizmetler.length); sayac('isemri', isEmirleri.length);
  sayac('rapor', raporlar.length); sayac('uygunsuzluk', uygunsuzluklar.length);
  sayac('fatura', A.liste('faturalar').filter(function(f){ return (f.lokasyonlar || []).indexOf(l.id) !== -1; }).length);

  /* --- 5 ayrı durum akışı --- */
  var odemeDurum = (function(){
    var h = A.liste('taseronHakedisleri').filter(function(t){ return (t.lokasyonlar || []).indexOf(l.id) !== -1; })[0];
    return h ? h.durum : null;
  })();
  var tahsilatDurum = (function(){
    var f = A.liste('faturalar').filter(function(x){ return (x.lokasyonlar || []).indexOf(l.id) !== -1; })[0];
    return f ? f.tahsilatDurum : null;
  })();
  document.getElementById('ldDurumlar').innerHTML = [
    { ad:'Operasyon Durumu', akis:'operasyon', k:l.operasyonDurum },
    { ad:'Rapor Durumu', akis:'rapor', k:l.raporDurum },
    { ad:'Fatura Durumu', akis:'fatura', k:l.faturaDurum },
    { ad:'Tahsilat Durumu', akis:'tahsilat', k:tahsilatDurum },
    { ad:'Taşeron Ödeme Durumu', akis:'taseronOdeme', k:odemeDurum }
  ].map(function(d){
    return '<div class="ld-durum"><dt>' + d.ad + '</dt><dd>'
      + (d.k ? GV.rozet(d.akis, d.k) : '<span class="gstat off"><i class="fa-solid fa-minus" aria-hidden="true"></i>Henüz başlamadı</span>')
      + '</dd></div>';
  }).join('');

  function bilgi(e,d){ return '<div class="info-item"><dt>' + GV.esc(e) + '</dt><dd' + (d ? '' : ' class="empty"') + '>' + (d || GV.bos) + '</dd></div>'; }
  document.getElementById('ldBilgi').innerHTML =
    bilgi('Sistem Kodu', GV.esc(l.kod)) + bilgi('Müşteri Lokasyon Kodu', GV.esc(l.musteriKod))
    + bilgi('Lokasyon Türü', GV.esc(l.tur)) + bilgi('Kapalı Alan', GV.n(l.m2) + ' m²')
    + bilgi('Müşteri', '<a href="musteri-detay.html?id=' + l.musteriId + '">' + GV.esc(l.musteriUnvan) + '</a>')
    + bilgi('Marka', GV.esc(l.markaAd))
    + bilgi('Proje', proje ? '<a href="proje-detay.html?id=' + proje.id + '">' + GV.esc(proje.ad) + '</a>' : null)
    + bilgi('Taşeron', l.taseronId ? '<a href="taseron-detay.html?id=' + l.taseronId + '">' + GV.esc(l.taseronAd) + '</a>' : null)
    + bilgi('Atanan Ekip', (l.ekipId || []).length
        ? l.ekipId.map(function(pid){ var p = A.kayit('personeller', pid);
            return p ? '<a href="personel-detay.html?id=' + pid + '">' + GV.esc(p.ad) + '</a>' : pid; }).join(', ')
        : null)
    + (l.not ? '<div class="info-item" style="grid-column:1/-1"><dt>Not</dt><dd>' + GV.esc(l.not) + '</dd></div>' : '');

  document.getElementById('ldHarita').innerHTML =
    '<div><div class="ld-pin"><i class="fa-solid fa-location-dot" aria-hidden="true"></i></div>'
    + '<p>' + GV.esc(l.ilce + ' / ' + l.il) + '</p>'
    + '<span>Konum görseli demo arayüzde şematik gösterilir; kurulumda harita servisi bağlanır.</span></div>';
  document.getElementById('ldAdres').innerHTML =
    bilgi('Açık Adres', GV.esc(l.adres)) + bilgi('İl / İlçe', GV.esc(l.il + ' / ' + l.ilce))
    + bilgi('Bölge', GV.esc(l.bolge));

  /* --- kişiler --- */
  document.getElementById('ldKisi').innerHTML = kisiler.length
    ? '<div class="gv-tscroll"><table class="gtable gtable-cards"><thead><tr>'
      + '<th scope="col">Kişi</th><th scope="col">İletişim Rolü</th><th scope="col">Kapsam</th>'
      + '<th scope="col">Telefon</th><th scope="col">E-posta</th></tr></thead><tbody>'
      + kisiler.map(function(k){
          return '<tr><td data-lbl="Kişi"><b class="t-strong">' + GV.esc(k.ad) + '</b>'
            + (k.birincil ? ' <span class="gtag mint">Birincil</span>' : '')
            + '<br><span class="muted" style="font-size:11.5px">' + GV.esc(k.unvan) + '</span></td>'
            + '<td data-lbl="İletişim Rolü"><span class="gtag">' + GV.esc(k.iletisimRolu) + '</span></td>'
            + '<td data-lbl="Kapsam">' + (k.lokasyonId ? 'Bu lokasyon' : '<span class="muted">Müşteri merkezi</span>') + '</td>'
            + '<td data-lbl="Telefon">' + GV.esc(k.telefon) + '</td>'
            + '<td data-lbl="E-posta"><a href="mailto:' + GV.esc(k.eposta) + '">' + GV.esc(k.eposta) + '</a></td></tr>';
        }).join('') + '</tbody></table></div>'
    : gvEmpty({ ikon:'fa-address-book', baslik:'Yetkili tanımsız',
        metin:'Bu lokasyon için iletişim kişisi tanımlanmadı. Kontrol tarihi onayı ve rapor teslimi için en az bir yetkili gereklidir.',
        aksiyonlar:'<a class="btn btn-acc" href="iletisim-kisileri.html"><i class="fa-solid fa-plus" aria-hidden="true"></i>Kişi Ekle</a>' });

  /* --- hizmet kapsamı --- */
  var birimAd = { adet:'adet', lokasyon:'lokasyon', sistem:'sistem', metrekare:'m²', gun:'gün', 'olcum-seti':'ölçüm seti', dokuman:'doküman' };
  var kaynakAd = { sablon:'Şablondan uygulandı', musteri:'Müşteri bildirimi', kesif:'Saha keşfi' };
  document.getElementById('ldKapsam').innerHTML = hizmetler.length
    ? '<div class="gv-tscroll"><table class="gtable gtable-cards"><thead><tr>'
      + '<th scope="col">Poz</th><th scope="col">Hizmet</th><th scope="col" class="num">Miktar</th>'
      + '<th scope="col">Birim</th><th scope="col" class="num">Periyot</th>'
      + '<th scope="col">Kaynak</th><th scope="col" class="num">Tutar</th></tr></thead><tbody>'
      + hizmetler.map(function(h){
          var bf = A.birimSatisFiyati(h.hizmetId, proje ? proje.fiyatListesiId : null);
          return '<tr><td data-lbl="Poz"><b class="t-strong">' + GV.esc(h.poz) + '</b></td>'
            + '<td data-lbl="Hizmet"><a href="hizmet-detay.html?id=' + h.hizmetId + '">' + GV.esc(h.hizmetAd) + '</a></td>'
            + '<td data-lbl="Miktar" class="num">' + GV.n(h.planlananMiktar) + '</td>'
            + '<td data-lbl="Birim">' + GV.esc(birimAd[h.birim] || h.birim) + '</td>'
            + '<td data-lbl="Periyot" class="num">' + (h.periyotAy ? h.periyotAy + ' ay' : '—') + '</td>'
            + '<td data-lbl="Kaynak"><span class="gtag' + (h.kaynak === 'sablon' ? ' warn' : h.kaynak === 'kesif' ? ' ok' : '') + '">'
            + GV.esc(kaynakAd[h.kaynak] || h.kaynak) + '</span></td>'
            + '<td data-lbl="Tutar" class="num">' + GV.tl(bf * h.planlananMiktar) + '</td></tr>';
        }).join('')
      + '</tbody><tfoot><tr><td data-lbl="" colspan="6">Toplam</td><td class="num">'
      + GV.tl(hizmetler.reduce(function(t,h){ return t + A.birimSatisFiyati(h.hizmetId, proje ? proje.fiyatListesiId : null) * h.planlananMiktar; }, 0))
      + '</td></tr></tfoot></table></div>'
    : gvEmpty({ ikon:'fa-list-check', baslik:'Hizmet kapsamı tanımsız',
        metin:'Bu lokasyon için hizmet pozisyonu ve miktar bilgisi girilmedi. Ön envanter şablonu uygulayabilirsiniz.',
        aksiyonlar:'<a class="btn btn-acc" href="on-envanter.html?lokasyon=' + l.id + '"><i class="fa-solid fa-clipboard-list" aria-hidden="true"></i>Ön Envanter</a>' });

  /* --- envanter ve mutabakat özeti --- */
  document.getElementById('ldMtbLink').href = GV.href('envanter-mutabakati.html?lokasyon=' + l.id);
  document.getElementById('ldEnvanter').innerHTML = mutabakat.length
    ? '<div class="gv-tscroll"><table class="gtable gtable-cards"><thead><tr>'
      + '<th scope="col">Poz</th><th scope="col">Hizmet</th><th scope="col" class="num">Planlanan</th>'
      + '<th scope="col" class="num">Sahada</th><th scope="col" class="num">Kontrol Edilen</th>'
      + '<th scope="col" class="num">Fark</th><th scope="col">Mutabakat</th></tr></thead><tbody>'
      + mutabakat.map(function(m){
          var fark = m.sahadaBulunan - m.planlanan;
          return '<tr><td data-lbl="Poz"><b class="t-strong">' + GV.esc(m.poz) + '</b></td>'
            + '<td data-lbl="Hizmet">' + GV.esc(m.hizmetAd) + '</td>'
            + '<td data-lbl="Planlanan" class="num">' + GV.n(m.planlanan) + '</td>'
            + '<td data-lbl="Sahada" class="num">' + GV.n(m.sahadaBulunan) + '</td>'
            + '<td data-lbl="Kontrol Edilen" class="num">' + GV.n(m.kontrolEdilen) + '</td>'
            + '<td data-lbl="Fark" class="num">' + (fark === 0 ? '<span class="diff zero">0</span>'
                : '<span class="diff ' + (fark > 0 ? 'plus' : 'minus') + '"><i class="fa-solid fa-'
                  + (fark > 0 ? 'plus' : 'minus') + '" aria-hidden="true"></i>' + GV.n(Math.abs(fark)) + '</span>') + '</td>'
            + '<td data-lbl="Mutabakat">' + (m.durum === 'onayli' ? GV.rozetOzel('ok','fa-circle-check','Onaylı')
                : m.durum === 'itirazli' ? GV.rozetOzel('danger','fa-scale-unbalanced','İtirazlı')
                : GV.rozetOzel('warn','fa-hourglass-half','Bekliyor')) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
    : gvEmpty({ ikon:'fa-scale-balanced', baslik:'Gerçekleşen envanter yok',
        metin:'Saha kontrolü tamamlanmadığı için gerçekleşen miktar ve mutabakat kaydı oluşmadı. Ön envanter “Hizmet Kapsamı” sekmesinde görüntülenir.' });

  document.getElementById('ldEkipman').innerHTML = ekipmanlar.length
    ? '<div class="gv-tscroll"><table class="gtable gtable-cards"><thead><tr>'
      + '<th scope="col">Ekipman</th><th scope="col">QR / Barkod</th><th scope="col">Marka / Model</th>'
      + '<th scope="col">Seri No</th><th scope="col" class="num">Üretim</th>'
      + '<th scope="col">Son Kontrol</th><th scope="col">Sonraki</th><th scope="col">Durum</th></tr></thead><tbody>'
      + ekipmanlar.slice(0,30).map(function(e){
          return '<tr><td data-lbl="Ekipman"><a href="ekipman-detay.html?id=' + e.id + '"><b class="t-strong">' + GV.esc(e.ad) + '</b></a>'
            + '<br><span class="muted" style="font-size:11.5px">' + GV.esc(e.kod) + '</span></td>'
            + '<td data-lbl="QR / Barkod"><code style="font-size:11.5px">' + GV.esc(e.qr) + '</code></td>'
            + '<td data-lbl="Marka / Model">' + GV.esc(e.marka + ' ' + e.model) + '</td>'
            + '<td data-lbl="Seri No">' + GV.esc(e.seri) + '</td>'
            + '<td data-lbl="Üretim" class="num">' + e.uretimYili + '</td>'
            + '<td data-lbl="Son Kontrol">' + GV.d(e.sonKontrol) + '</td>'
            + '<td data-lbl="Sonraki">' + GV.d(e.sonrakiKontrol) + '</td>'
            + '<td data-lbl="Durum">' + (e.durum === 'aktif' ? GV.rozetOzel('ok','fa-circle-check','Aktif')
                : e.durum === 'bakimda' ? GV.rozetOzel('warn','fa-screwdriver-wrench','Bakımda')
                : GV.rozetOzel('off','fa-ban','Kullanım dışı')) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      + (ekipmanlar.length > 30 ? '<div class="gc-foot"><span>' + GV.n(ekipmanlar.length) + ' ekipmandan ilk 30 tanesi gösteriliyor.</span>'
          + '<a class="gc-link" href="ekipmanlar.html?lokasyon=' + l.id + '">Tümünü gör <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a></div>' : '')
    : gvEmpty({ ikon:'fa-gears', baslik:'Tekil ekipman kartı yok',
        metin:'Bu lokasyonda takip kartı açılmış tekil ekipman bulunmuyor. Miktar bazlı hizmetler “Hizmet Kapsamı” sekmesinde izlenir.' });

  /* --- iş emirleri --- */
  document.getElementById('ldIsEmri').innerHTML = isEmirleri.length
    ? '<div class="gv-tscroll"><table class="gtable gtable-cards"><thead><tr>'
      + '<th scope="col">İş Emri</th><th scope="col">Tarih</th><th scope="col">Ekip</th>'
      + '<th scope="col">Taşeron</th><th scope="col">Operasyon</th><th scope="col">Rapor</th></tr></thead><tbody>'
      + isEmirleri.map(function(i){
          return '<tr><td data-lbl="İş Emri"><a href="is-emri-detay.html?id=' + i.id + '"><b class="t-strong">' + GV.esc(i.id) + '</b></a></td>'
            + '<td data-lbl="Tarih">' + GV.d(i.tarih) + ' · ' + i.saat + '</td>'
            + '<td data-lbl="Ekip">' + GV.esc(i.ekipAdlari.join(', ') || '—') + '</td>'
            + '<td data-lbl="Taşeron">' + GV.esc(i.taseronAd || '—') + '</td>'
            + '<td data-lbl="Operasyon">' + GV.rozet('operasyon', i.operasyonDurum) + '</td>'
            + '<td data-lbl="Rapor">' + GV.rozet('rapor', i.raporDurum) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
    : gvEmpty({ ikon:'fa-clipboard-check', baslik:'İş emri yok', metin:'Bu lokasyon için henüz iş emri açılmadı.',
        aksiyonlar:'<a class="btn btn-acc" href="is-emri-form.html?lokasyon=' + l.id + '"><i class="fa-solid fa-plus" aria-hidden="true"></i>İş Emri Aç</a>' });

  /* --- raporlar --- */
  document.getElementById('ldRapor').innerHTML = raporlar.length
    ? '<div class="gv-tscroll"><table class="gtable gtable-cards"><thead><tr>'
      + '<th scope="col">Rapor</th><th scope="col">Kontrol</th><th scope="col">Rapor Tarihi</th>'
      + '<th scope="col">Teslim</th><th scope="col">Sonuç</th><th scope="col">Durum</th>'
      + '<th scope="col" class="num">Sürüm</th></tr></thead><tbody>'
      + raporlar.map(function(r){
          return '<tr><td data-lbl="Rapor"><a href="rapor-detay.html?id=' + r.id + '"><b class="t-strong">' + GV.esc(r.no) + '</b></a></td>'
            + '<td data-lbl="Kontrol">' + GV.d(r.kontrolTarihi) + '</td>'
            + '<td data-lbl="Rapor Tarihi">' + GV.d(r.raporTarihi) + '</td>'
            + '<td data-lbl="Teslim">' + GV.d(r.teslimTarihi) + '</td>'
            + '<td data-lbl="Sonuç">' + (r.sonuc === 'uygun' ? GV.rozetOzel('ok','fa-circle-check','Uygun')
                : r.sonuc === 'sartli-uygun' ? GV.rozetOzel('warn','fa-circle-half-stroke','Şartlı uygun')
                : GV.rozetOzel('danger','fa-circle-xmark','Uygun değil')) + '</td>'
            + '<td data-lbl="Durum">' + (r.durum === 'arsiv' ? GV.rozetOzel('off','fa-box-archive','Arşiv') : GV.rozet('rapor', r.durum)) + '</td>'
            + '<td data-lbl="Sürüm" class="num">v' + r.versiyon + '</td></tr>';
        }).join('') + '</tbody></table></div>'
    : gvEmpty({ ikon:'fa-file-lines', baslik:'Rapor yok', metin:'Bu lokasyon için teknik rapor düzenlenmedi.' });

  /* --- uygunsuzluklar --- */
  var onemAd = { kritik:['danger','fa-fire','Kritik'], yuksek:['danger','fa-triangle-exclamation','Yüksek'],
    orta:['warn','fa-circle-exclamation','Orta'], dusuk:['info','fa-circle-info','Düşük'] };
  document.getElementById('ldUygunsuzluk').innerHTML = uygunsuzluklar.length
    ? '<div class="gv-tscroll"><table class="gtable gtable-cards"><thead><tr>'
      + '<th scope="col">Kayıt</th><th scope="col">Önem</th><th scope="col">Tespit</th>'
      + '<th scope="col">Termin</th><th scope="col">Yeniden Kontrol</th><th scope="col">Durum</th></tr></thead><tbody>'
      + uygunsuzluklar.map(function(u){
          var o = onemAd[u.onem] || onemAd.orta;
          return '<tr><td data-lbl="Kayıt"><a href="uygunsuzluk-detay.html?id=' + u.id + '"><b class="t-strong">' + GV.esc(u.baslik) + '</b></a>'
            + '<br><span class="muted" style="font-size:11.5px">' + GV.esc(u.id) + '</span></td>'
            + '<td data-lbl="Önem">' + GV.rozetOzel(o[0], o[1], o[2]) + '</td>'
            + '<td data-lbl="Tespit">' + GV.d(u.tespit) + '</td>'
            + '<td data-lbl="Termin">' + GV.d(u.termin) + '</td>'
            + '<td data-lbl="Yeniden Kontrol">' + (u.yenidenKontrol === 'gerekli' ? GV.rozetOzel('danger','fa-rotate-right','Gerekli')
                : u.yenidenKontrol === 'planlandi' ? GV.rozetOzel('warn','fa-calendar-check','Planlandı')
                : u.yenidenKontrol === 'tamamlandi' ? GV.rozetOzel('ok','fa-check','Tamamlandı')
                : '<span class="muted">Gerekmiyor</span>') + '</td>'
            + '<td data-lbl="Durum">' + (u.durum === 'kapandi' ? GV.rozetOzel('ok','fa-circle-check','Kapandı')
                : u.durum === 'gecikti' ? GV.rozetOzel('danger','fa-clock','Gecikti')
                : GV.rozetOzel('warn','fa-circle-dot','Açık')) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
    : gvEmpty({ ikon:'fa-circle-check', baslik:'Uygunsuzluk yok', metin:'Bu lokasyonda tespit edilmiş uygunsuzluk bulunmuyor.' });

  /* --- fatura --- */
  var faturalar = A.liste('faturalar').filter(function(f){ return (f.lokasyonlar || []).indexOf(l.id) !== -1; });
  var grup = A.liste('faturaGruplari').filter(function(g){ return g.lokasyonlar.indexOf(l.id) !== -1; })[0];
  document.getElementById('ldFatura').innerHTML =
    '<div class="gv-note ' + (faturaKontrol.uygun ? 'ok' : 'warn') + '" style="margin-bottom:16px">'
    + '<i class="fa-solid fa-' + (faturaKontrol.uygun ? 'circle-check' : 'triangle-exclamation') + '" aria-hidden="true"></i>'
    + '<span>' + (faturaKontrol.uygun
        ? '<b>Faturaya hazır.</b> Kalan faturalanabilir miktar ' + GV.n(faturaKontrol.kalanMiktar)
          + ', tahmini tutar ' + GV.tl(A.lokasyonFaturaTutari(l.id, l.projeId)) + '.'
        : '<b>Faturaya uygun değil.</b> ' + GV.esc(faturaKontrol.sebep)) + '</span></div>'
    + (grup ? '<dl class="info-rows"><div class="info-row"><dt>Fatura grubu</dt>'
        + '<dd><a href="fatura-grubu-detay.html?id=' + grup.id + '">' + GV.esc(grup.ad) + '</a></dd></div>'
        + '<div class="info-row"><dt>Grup durumu</dt><dd>' + GV.esc(grup.durum.replace(/-/g,' ')) + '</dd></div></dl>'
      : '<p class="muted" style="font-size:13px">Bu lokasyon henüz bir fatura grubuna eklenmedi.</p>')
    + (faturalar.length
      ? '<div class="gv-tscroll" style="margin-top:16px"><table class="gtable gtable-cards"><thead><tr>'
        + '<th scope="col">Fatura</th><th scope="col">Tarih</th><th scope="col" class="num">Toplam</th>'
        + '<th scope="col">Tahsilat</th></tr></thead><tbody>'
        + faturalar.map(function(f){
            return '<tr><td data-lbl="Fatura"><a href="faturalar.html?id=' + f.id + '">' + GV.esc(f.no) + '</a></td>'
              + '<td data-lbl="Tarih">' + GV.d(f.tarih) + '</td>'
              + '<td data-lbl="Toplam" class="num">' + GV.tl(f.toplam) + '</td>'
              + '<td data-lbl="Tahsilat">' + GV.rozet('tahsilat', f.tahsilatDurum) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
      : '');

  /* --- sağ kolon --- */
  document.getElementById('ldOzet').innerHTML =
    '<div class="info-row"><dt>Hizmet kalemi</dt><dd>' + GV.n(hizmetler.length) + '</dd></div>'
    + '<div class="info-row"><dt>Planlanan miktar</dt><dd>' + GV.n(hizmetler.reduce(function(t,h){ return t + h.planlananMiktar; }, 0)) + '</dd></div>'
    + '<div class="info-row"><dt>Ekipman kartı</dt><dd>' + GV.n(ekipmanlar.length) + '</dd></div>'
    + '<div class="info-row"><dt>İş emri</dt><dd>' + GV.n(isEmirleri.length) + '</dd></div>'
    + '<div class="info-row"><dt>Teknik rapor</dt><dd>' + GV.n(raporlar.length) + '</dd></div>'
    + '<div class="info-row"><dt>Açık uygunsuzluk</dt><dd>' + GV.n(uygunsuzluklar.filter(function(u){ return u.durum !== 'kapandi'; }).length) + '</dd></div>'
    + '<div class="info-row"><dt>Kapsam tutarı</dt><dd>' + GV.tl(hizmetler.reduce(function(t,h){
        return t + A.birimSatisFiyati(h.hizmetId, proje ? proje.fiyatListesiId : null) * h.planlananMiktar; }, 0)) + '</dd></div>';

  document.getElementById('ldTarih').innerHTML =
    '<div class="info-row"><dt>Kontrol tarihi</dt><dd>' + GV.d(l.kontrolTarihi) + '</dd></div>'
    + '<div class="info-row"><dt>Rapor tarihi</dt><dd>' + GV.d(l.raporTarihi) + '</dd></div>'
    + '<div class="info-row"><dt>Rapor teslim tarihi</dt><dd>' + GV.d(l.raporTeslimTarihi) + '</dd></div>'
    + '<div class="info-row"><dt>Sonraki kontrol</dt><dd>' + GV.d(l.sonrakiKontrol) + '</dd></div>'
    + '<div class="info-row"><dt>Kalan süre</dt><dd>' + (function(){
        if (!l.sonrakiKontrol) return '<span class="muted">Ana tarih yok</span>';
        var g = GV.gun(BUGUN, l.sonrakiKontrol);
        return g < 0 ? Math.abs(g) + ' gün geçti' : GV.n(g) + ' gün';
      })() + '</dd></div>';
  if (!l.sonrakiKontrol) {
    document.getElementById('ldTarih').insertAdjacentHTML('beforeend',
      '<div class="gv-note" style="margin-top:12px"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>'
      + '<span>Sonraki kontrol tarihi, kontrol tamamlanıp rapor onaylandığında hizmet ve ekipman periyoduna göre hesaplanır. '
      + 'Ana tarih olmadığı için boş bırakılmıştır.</span></div>');
  }

  document.getElementById('ldHizli').innerHTML =
    '<a class="btn btn-ghost btn-block" href="is-emri-form.html?lokasyon=' + l.id + '"><i class="fa-solid fa-plus" aria-hidden="true"></i>İş Emri Aç</a>'
    + '<a class="btn btn-ghost btn-block" href="on-envanter.html?lokasyon=' + l.id + '"><i class="fa-solid fa-clipboard-list" aria-hidden="true"></i>Ön Envanter</a>'
    + '<a class="btn btn-ghost btn-block" href="envanter-mutabakati.html?lokasyon=' + l.id + '"><i class="fa-solid fa-scale-balanced" aria-hidden="true"></i>Mutabakat</a>'
    + '<a class="btn btn-ghost btn-block" href="saha-kontrol-formu.html?lokasyon=' + l.id + '"><i class="fa-solid fa-mobile-screen" aria-hidden="true"></i>Saha Kontrol Formu</a>';

  /* --- işlem geçmişi --- */
  var gecmis = [];
  gecmis.push({ ikon:'fa-location-dot', ton:'', b:'Lokasyon rehbere eklendi', s:l.kod + ' · ' + l.musteriAd, t: proje ? proje.baslangic : null });
  if (proje) gecmis.push({ ikon:'fa-diagram-project', ton:'info', b:'Projeye dâhil edildi', s:proje.kod, t:proje.baslangic });
  isEmirleri.forEach(function(i){
    gecmis.push({ ikon:'fa-clipboard-check', ton:'', b:'İş emri oluşturuldu', s:i.id + ' · ' + GV.d(i.tarih), t:i.tarih });
    if (i.bitis) gecmis.push({ ikon:'fa-circle-check', ton:'ok', b:'Saha kontrolü tamamlandı', s:i.id, t:i.bitis });
  });
  raporlar.forEach(function(r){
    if (r.raporTarihi) gecmis.push({ ikon:'fa-file-lines', ton:'info', b:'Rapor hazırlandı', s:r.no, t:r.raporTarihi });
    if (r.teslimTarihi) gecmis.push({ ikon:'fa-paper-plane', ton:'ok', b:'Rapor müşteriye teslim edildi', s:r.no, t:r.teslimTarihi });
  });
  uygunsuzluklar.forEach(function(u){
    gecmis.push({ ikon:'fa-circle-exclamation', ton:'danger', b:'Uygunsuzluk kaydedildi', s:u.baslik, t:u.tespit });
    if (u.kapanis) gecmis.push({ ikon:'fa-check', ton:'ok', b:'Uygunsuzluk kapatıldı', s:u.baslik, t:u.kapanis });
  });
  A.liste('islemKayitlari').filter(function(x){ return x.kayit === l.id; }).forEach(function(x){
    gecmis.push({ ikon:'fa-pen', ton:'', b:x.islem.replace(/-/g,' '), s:x.aciklama, t:String(x.zaman).substring(0,10) });
  });
  gecmis = gecmis.filter(function(g){ return g.t; }).sort(function(a,b){ return String(b.t).localeCompare(String(a.t)); });
  document.getElementById('ldGecmis').innerHTML = gecmis.length
    ? '<div class="act-list">' + gecmis.map(function(g){
        return '<div class="act-row"><span class="act-ico ' + g.ton + '"><i class="fa-solid ' + g.ikon + '" aria-hidden="true"></i></span>'
          + '<span class="act-info"><b>' + GV.esc(g.b) + '</b><span>' + GV.esc(g.s) + '</span></span>'
          + '<span class="act-time">' + GV.d(g.t) + '</span></div>';
      }).join('') + '</div>'
    : gvEmpty({ ikon:'fa-clock-rotate-left', baslik:'İşlem geçmişi yok', metin:'Bu lokasyonda kayıtlı işlem bulunmuyor.' });

  /* --- durum değiştir --- */
  document.getElementById('ldDurumBtn').addEventListener('click', function(){
    gvModal({
      baslik:'Operasyon durumunu değiştir', ikon:'fa-arrows-rotate',
      metin:'<b>' + GV.esc(l.ad) + '</b> lokasyonunun operasyon durumu değiştirilecek. '
        + 'Rapor, fatura, tahsilat ve taşeron ödeme durumları ayrı akışlardır ve bu işlemden etkilenmez.',
      govde:'<div class="gfield"><label for="ldYeniDurum">Yeni operasyon durumu</label><select id="ldYeniDurum">'
        + A.durumListesi('operasyon').map(function(d){
            return '<option value="' + d.k + '"' + (d.k === l.operasyonDurum ? ' selected' : '') + '>' + GV.esc(d.ad) + '</option>'; }).join('')
        + '</select></div>'
        + '<div class="gfield full" style="margin-top:14px"><label for="ldDurumAcik">Açıklama *</label>'
        + '<textarea id="ldDurumAcik" placeholder="Durum değişikliğinin gerekçesi"></textarea></div>',
      butonlar:[{ etiket:'Vazgeç', sinif:'btn-ghost' },
        { etiket:'Güncelle', sinif:'btn-acc', ikon:'fa-check', tikla: function(kap){
            var acik = kap.querySelector('#ldDurumAcik').value.trim();
            if (!acik) { gvToast('Açıklama zorunludur.', { ton:'danger' }); return false; }
            A.durumDegistir('lokasyonlar', l.id, 'operasyonDurum', kap.querySelector('#ldYeniDurum').value, acik)
              .then(function(){ gvToast('Operasyon durumu güncellendi.', { ton:'ok' }); setTimeout(function(){ location.reload(); }, 700); });
          } }]
    });
  });
})();
</script>
</body>
</html>
